name: Apply AI Horde Sync

on:
  push:
    branches: [main]
    paths:
      - '.sync/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild latest source payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .sync/READY
          cat .sync/aihorde-payload.* > /tmp/aihorde-sync.b64
          base64 -d /tmp/aihorde-sync.b64 > /tmp/aihorde-sync.tar.xz
          expected="$(tr -d '[:space:]' < .sync/READY)"
          test -n "$expected"
          echo "$expected  /tmp/aihorde-sync.tar.xz" | sha256sum -c -
          tar -xJf /tmp/aihorde-sync.tar.xz -C .

      - name: Verify backend syntax
        shell: bash
        run: |
          set -euo pipefail
          cp api/chat.js /tmp/chat-check.mjs
          node --check /tmp/chat-check.mjs

      - name: Verify frontend inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'script':
                      return
                  values = dict(attrs)
                  self.in_script = True
                  self.external = bool(values.get('src'))
                  self.current = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      if not self.external and ''.join(self.current).strip():
                          self.parts.append(''.join(self.current))
                      self.in_script = False
                      self.external = False
                      self.current = []

          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.parts:
              raise SystemExit('No inline JavaScript found in index.html')
          Path('/tmp/index-inline.js').write_text('\n;\n'.join(parser.parts), encoding='utf-8')
          print(f'extracted {len(parser.parts)} inline script block(s)')
          PY
          node --check /tmp/index-inline.js

      - name: Prepare contract-test compatibility path
        shell: bash
        run: cp api/chat.js chat.js

      - name: Verify public fallback contract
        run: python tests/public_fallback_contract_test.py

      - name: Verify existing activity contract
        run: python tests/activity_contract_test.py

      - name: Commit synced source
        shell: bash
        run: |
          set -euo pipefail
          rm -f chat.js
          rm -rf .sync
          git config user.name "JepongDevxyz Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html api/chat.js tests/public_fallback_contract_test.py tests/activity_contract_test.py .sync
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: sync AI Horde and public fallback routing"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
