name: Apply AI Horde Sync

on:
  push:
    branches: [main]
    paths:
      - '.sync/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild latest source payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .sync/READY
          cat .sync/payload.* > /tmp/aihorde-sync.b64
          base64 -d /tmp/aihorde-sync.b64 > /tmp/aihorde-sync.tar.xz
          expected="$(tr -d '[:space:]' < .sync/READY)"
          test -n "$expected"
          echo "$expected  /tmp/aihorde-sync.tar.xz" | sha256sum -c -
          tar -xJf /tmp/aihorde-sync.tar.xz -C .

      - name: Verify backend syntax
        shell: bash
        run: |
          cp api/chat.js /tmp/chat-check.mjs
          node --check /tmp/chat-check.mjs

      - name: Verify public fallback contract
        run: python tests/public_fallback_contract_test.py

      - name: Verify existing activity contract
        run: python tests/activity_contract_test.py

      - name: Commit synced source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          git config user.name "JepongDevxyz Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html api/chat.js tests/public_fallback_contract_test.py tests/activity_contract_test.py .sync
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: sync AI Horde and public fallback routing"
          git push origin HEAD:main
