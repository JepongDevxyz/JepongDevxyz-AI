name: Apply Mobile UI Fixes V2

on:
  push:
    branches: [main]
    paths:
      - '.sync/MOBILE_UI_APPLY_V2'

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Personalization Navigation v7
        run: python .sync/apply_personalization_v7.py

      - name: Verify backend syntax
        run: |
          cp api/chat.js /tmp/chat-check.mjs
          node --check /tmp/chat-check.mjs

      - name: Verify frontend inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_script=False; self.external=False; self.parts=[]; self.current=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()!='script': return
                  values=dict(attrs); self.in_script=True; self.external=bool(values.get('src')); self.current=[]
              def handle_data(self, data):
                  if self.in_script and not self.external: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=='script' and self.in_script:
                      if not self.external and ''.join(self.current).strip(): self.parts.append(''.join(self.current))
                      self.in_script=False; self.external=False; self.current=[]
          parser=Scripts(); parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.parts: raise SystemExit('No inline JavaScript found')
          Path('/tmp/index-inline.js').write_text('\n;\n'.join(parser.parts),encoding='utf-8')
          print(f'extracted {len(parser.parts)} inline script block(s)')
          PY
          node --check /tmp/index-inline.js

      - name: Verify Personalization Navigation v7 regressions
        run: |
          printf '{"type":"commonjs"}\n' > tests/package.json
          node tests/test_activity_voice_v3.js
          node tests/test_personalization_navigation_v7.js
          node tests/test_personalization_redesign_v6.js
          node tests/test_runtime_regressions.js
          node tests/test_settings_personalization_v5.js
          python regression_mobile_runtime.py
          rm -f tests/package.json

      - name: Commit verified Personalization Navigation v7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JepongDevxyz Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .sync/apply_personalization_v7.py .sync/v7_payload_*.txt tests/package.json
          git add -A
          git commit -m "feat: apply Personalization Navigation v7"
          git pull --rebase origin main
          git push origin HEAD:main
