name: Apply Mobile UI Fixes

on:
  push:
    branches: [main]
    paths:
      - '.sync/MOBILE_UI_APPLY'

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile UI fixes to latest main
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
          '''        .sidebar { 
              position: absolute; 
              width: var(--drawer-width); 
              max-width: 85vw;
              height: 100%; 
              top: 0;
              background: #0f172a; 
              z-index: 901; 
              display: flex; 
              flex-direction: column; 
              padding: 18px 16px; 
              gap: 14px; 
              will-change: transform;
              transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
              box-shadow: 0 0 35px rgba(0,0,0,0.6);
          }
          ''',
          '''        .sidebar { 
              position: absolute; 
              width: var(--drawer-width); 
              max-width: 85vw;
              height: 100%; 
              min-height: 0;
              top: 0;
              background: #0f172a; 
              z-index: 901; 
              display: flex; 
              flex-direction: column; 
              padding: 18px 16px max(16px, env(safe-area-inset-bottom)); 
              gap: 14px; 
              overflow: hidden;
              overscroll-behavior: contain;
              will-change: transform;
              transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
              box-shadow: 0 0 35px rgba(0,0,0,0.6);
          }
          ''', 'sidebar shell')

          replace_once(
          '''        .sidebar.drawer-bottom {
              top: auto; bottom: 0; left: 0; right: 0;
              width: 100%; max-width: 100vw; height: 75vh;
              border-top: 1px solid var(--border-color);
              border-top-left-radius: 28px;
              border-top-right-radius: 28px;
              border-bottom-left-radius: 0;
              border-bottom-right-radius: 0;
              transform: translateY(100%);
          }
          ''',
          '''        .sidebar.drawer-bottom {
              top: auto; bottom: 0; left: 0; right: 0;
              width: 100%; max-width: 100vw;
              height: min(75dvh, calc(var(--jepong-vh, 100dvh) - 10px));
              max-height: calc(var(--jepong-vh, 100dvh) - 10px);
              border-top: 1px solid var(--border-color);
              border-top-left-radius: 28px;
              border-top-right-radius: 28px;
              border-bottom-left-radius: 0;
              border-bottom-right-radius: 0;
              transform: translateY(100%);
          }
          ''', 'bottom drawer viewport clamp')

          replace_once(
          '''        body.theme-light .search-chat-input { background: #e2e8f0; }
          
          .chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
          ''',
          '''        body.theme-light .search-chat-input { background: #e2e8f0; }

          .sidebar-header,
          .new-chat-btn,
          .search-bar-wrap { flex-shrink: 0; }
          
          .chat-history-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
          ''', 'history scroll container')

          replace_once(
          '''        .hist-action-btn.pin-btn.pinned { color: #f59e0b; }

          .chat-viewport-wrapper {
          ''',
          '''        .hist-action-btn.pin-btn.pinned { color: #f59e0b; }

          #sidebar-footer-settings {
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:12px;
              flex-shrink:0;
              min-height:52px;
              padding:12px 2px 2px;
              border-top:1px solid var(--border-color);
              background:linear-gradient(180deg, rgba(15,23,42,0), rgba(15,23,42,.96) 24%);
          }
          body.theme-light #sidebar-footer-settings { background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.98) 24%); }
