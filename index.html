<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf8">
<title>JepongDevxyz AI</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%23111110' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 9h22'/%3E%3Cpath d='M29 9v21a9 9 0 0 1-18 0v-3'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Sidebar">
    <div class="sb-top">
      <div class="sb-search"><span data-icon="search" data-size="16"></span><input id="chatSearch" type="text" placeholder="Search conversations" autocomplete="off"><button id="chatSearchClear" class="icon-btn sm" hidden aria-label="Clear search"><span data-icon="x" data-size="14"></span></button></div>
      <button id="newChatBtn" class="sb-new"><span class="sb-new-plus"><span data-icon="plus" data-size="14"></span></span><span>New chat</span></button>
    </div>
    <div id="chatList" class="sb-list"></div>
    <div class="sb-sec-row" id="sbArchSec" hidden><span class="sb-sec">Archived</span><span class="sb-sec-actions"><button class="icon-btn sb-sec-chev" id="sbArchChev" type="button" aria-label="Collapse archived"><span data-icon="chevron-down" data-size="16"></span></button></span></div>
    <div id="archList" class="sb-list" hidden></div>
    <div class="sb-sec-row" id="sbProjSec"><span class="sb-sec">Projects</span><span class="sb-sec-actions"><button class="icon-btn sb-sec-chev" id="sbProjChev" type="button" aria-label="Collapse projects"><span data-icon="chevron-down" data-size="16"></span></button><button class="icon-btn" id="sbNewProj" type="button" aria-label="New project"><span data-icon="plus" data-size="16"></span></button></span></div>
    <div id="projList" class="sb-list"></div>
    <div class="sb-explore">
      <div class="sb-sec">Explore</div>
      <button class="sb-row" data-explore="help"><span data-icon="circle-help" data-size="18"></span><span>Help</span></button>
      <button class="sb-row" data-explore="projects"><span data-icon="folder" data-size="18"></span><span>Projects</span></button>
      <button class="sb-row" data-explore="invite"><span data-icon="user-plus" data-size="18"></span><span>Invite</span></button>
    </div>
    <div class="sb-bottom">
      <button class="sb-upgrade" id="sbUpgradeBtn" data-explore="upgrade"><span data-icon="rocket" data-size="16"></span><span>Upgrade to Premium</span></button>
      <button class="sb-row" data-explore="settings"><span data-icon="settings" data-size="18"></span><span>Settings</span></button>
      <button class="sb-profile" id="profileBtn"><span class="sb-avatar" id="profileAvatar">J</span><span class="sb-profile-meta"><span id="profileNameLabel">Jepong</span><span class="sb-profile-sub" id="profileEmailLabel">Free plan</span></span></button>
    </div>
  </aside>
  <div id="scrim" hidden></div>

  <main id="main">
    <header id="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Open sidebar"><span data-icon="menu" data-size="20"></span></button>
      <div id="topTitle" class="top-title" role="button" tabindex="0" aria-label="Conversation options">JepongDevxyz AI</div>
      <button id="privateBtn" class="icon-btn" aria-label="Private chat" aria-pressed="false"><span data-icon="lock" data-size="18"></span></button>
      <button id="topSearchBtn" class="icon-btn" aria-label="Search chats"><span data-icon="search" data-size="20"></span></button>
      <button id="topNewBtn" class="icon-btn" aria-label="New chat"><span data-icon="square-pen" data-size="20"></span></button>
    </header>

    <div id="homeView">
      <div class="home-greet">
        <h1 id="greetLine1">Good morning, Jepong</h1>
        <p id="greetLine2">How can I help?</p>
      </div>
    </div>

    <div id="chatView" hidden>
      <div id="messages"></div>
    </div>

    <div id="composerDock">
      <div id="attachBar" class="attach-bar" hidden></div>
      <div id="composer" class="composer">
        <button id="plusBtn" class="plus-btn" type="button" aria-label="Attachments"><span data-icon="plus" data-size="18"></span></button>
        <textarea id="composerInput" rows="1" placeholder="Ask anything..." aria-label="Ask anything..."></textarea>
        <button id="modelBtn" class="model-btn" type="button"><span class="model-mark" id="modelMark"></span><span id="modelName">DeepSeek V4.1 Flash</span><span data-icon="chevron-down" data-size="14"></span></button>
        <button id="micBtn" class="mic-btn" type="button" aria-label="Dictate"><span data-icon="mic" data-size="18"></span></button>
        <button id="voiceBtn" class="voice-btn" type="button" aria-label="Voice mode"><span data-icon="audio-lines" data-size="18"></span></button>
        <button id="sendBtn" class="send-btn" type="button" aria-label="Send" disabled><span data-icon="arrow-up" data-size="18"></span></button>
        <button id="stopBtn" class="send-btn stop" type="button" aria-label="Stop" hidden><span class="stop-sq"></span></button>
      </div>
      <div id="homeSugg" class="home-sugg" hidden></div>
    </div>
    <button id="scrollBottom" class="scroll-bottom" type="button" aria-label="Scroll to bottom" hidden><span data-icon="arrow-down" data-size="16"></span></button>
  </main>
</div>

<!-- Attachments sheet -->
<div id="attachSheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><div class="sheet-title">Attachments</div><button class="icon-btn" data-close-sheet aria-label="Close"><span data-icon="x" data-size="18"></span></button></div>
    <div class="sheet-row" id="attachState">No file selected</div>
    <button class="sheet-list-btn" data-attach="camera"><span data-icon="camera" data-size="18"></span><span>Camera</span></button>
    <button class="sheet-list-btn" data-attach="library"><span data-icon="image" data-size="18"></span><span>Photo Library</span></button>
    <button class="sheet-list-btn" data-attach="files"><span data-icon="file" data-size="18"></span><span>Files</span></button>
  </div>
</div>

<!-- Image prompt sheet -->
<div id="imageSheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><div class="sheet-title">Create Image</div><button class="icon-btn" data-close-sheet aria-label="Close"><span data-icon="x" data-size="18"></span></button></div>
    <label class="field-label" for="imagePrompt">Image prompt</label>
    <textarea id="imagePrompt" rows="3" placeholder="Describe the image you want…"></textarea>
    <button id="imageGenerateBtn" class="btn-primary" type="button">Generate</button>
  </div>
</div>

<!-- Sources dialog -->
<div id="sourcesDialog" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><div class="sheet-title">Sources</div><button class="icon-btn" data-close-sheet aria-label="Close"><span data-icon="x" data-size="18"></span></button></div>
    <div class="tabs"><button class="tab active" data-src-tab="web">Web</button><button class="tab" data-src-tab="images">Images</button></div>
    <div id="sourcesWeb" class="sources-list"></div>
    <div id="sourcesImages" class="sources-list" hidden></div>
  </div>
</div>

<!-- Settings page layer -->
<div id="settingsPage" class="page-layer" hidden>
  <header class="page-head"><button id="settingsBack" class="icon-btn" aria-label="Back"><span data-icon="arrow-left" data-size="18"></span></button><h2 id="settingsTitle">Settings</h2><button id="settingsClose" class="icon-btn" aria-label="Close settings"><span data-icon="x" data-size="18"></span></button></header>
  <div id="settingsBody" class="page-body"></div>
</div>

<!-- Generic page layer (Help / Projects / Upgrade / Privacy / Terms) -->
<div id="infoPage" class="page-layer" hidden>
  <header class="page-head"><button id="infoBack" class="icon-btn" aria-label="Back"><span data-icon="arrow-left" data-size="18"></span></button><h2 id="infoTitle">Page</h2><button id="infoClose" class="icon-btn" aria-label="Close"><span data-icon="x" data-size="18"></span></button></header>
  <div id="infoBody" class="page-body"></div>
</div>

<!-- Confirm dialog -->
<div id="confirmModal" class="sheet" hidden>
  <div class="sheet-card dialog-card">
    <div class="dialog-title" id="confirmTitle">Are you sure?</div>
    <p class="dialog-text" id="confirmText"></p>
    <div class="dialog-actions"><button id="confirmCancel" class="btn-ghost" type="button">Cancel</button><button id="confirmOk" class="btn-danger" type="button">Delete</button></div>
  </div>
</div>

<!-- Generic info dialog -->
<div id="infoModal" class="sheet" hidden>
  <div class="sheet-card dialog-card">
    <div class="dialog-title" id="infoModalTitle">Notice</div>
    <p class="dialog-text" id="infoModalText"></p>
    <div class="dialog-actions"><button id="infoModalCancel" class="btn-ghost" type="button" hidden>Cancel</button><button id="infoModalOk" class="btn-primary" type="button">OK</button></div>
  </div>
</div>

<!-- Voice mode layer (Grok-style: full Listening state) -->
<div id="voiceMode" class="voice-layer" hidden>
  <div class="vm-status">
    <div class="vm-dots auto" id="vmDots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="vm-state-col">
      <div class="vm-state" id="vmState">Listening</div>
      <div class="vm-transcript" id="vmTranscript"></div>
    </div>
  </div>
  <div class="vm-bar">
    <button id="vmPlus" class="vm-plus" type="button" aria-label="Attachments"><span data-icon="plus" data-size="18"></span></button>
    <button id="vmVoiceSel" class="vm-sel" type="button"><span id="vmVoiceLabel">Device default · Assistant</span><span data-icon="chevron-down" data-size="14"></span></button>
    <div class="vm-dots mini auto" id="vmDotsMini" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <button id="vmMic" class="vm-mic" type="button" aria-label="Mute microphone"><span data-icon="mic" data-size="18"></span></button>
    <button id="vmStop" class="vm-stop" type="button" aria-label="Stop voice mode"><span class="stop-sq"></span></button>
  </div>
</div>

<!-- Voice settings sheet (opened from the voice-mode bar) -->
<div id="voiceSheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><div class="sheet-title">Voice</div><button class="icon-btn" data-close-sheet aria-label="Close"><span data-icon="x" data-size="18"></span></button></div>
    <div id="voiceSheetList" class="set-list"></div>
    <button class="set-row" id="vsPersonalityRow" type="button"><span class="set-label">Personality</span><span class="vs-pill" id="vsPersonality">Assistant<span data-icon="chevron-down" data-size="14"></span></span></button>
    <button class="set-row" id="vsSpeedRow" type="button"><span class="set-label">Speed</span><span class="vs-pill" id="vsSpeed">Normal<span data-icon="chevron-down" data-size="14"></span></span></button>
    <button class="set-row" id="vsMicRow" type="button"><span class="set-label">Microphone</span><span class="vs-pill" id="vsMic">Microphone<span data-icon="chevron-down" data-size="14"></span></span></button>
  </div>
</div>

<div id="toast" role="status" hidden></div>
<div id="warnStack" class="warn-stack" aria-live="polite"></div>
<input type="file" id="fileInput" hidden>
<script src="app.js"></script>
</body>
</html>
