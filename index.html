<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JepongDevxyz AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(21, 29, 45, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --user-msg: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --bot-msg: rgba(30, 41, 59, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); }

        .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card-bg); backdrop-filter: blur(20px); }
        @media (min-width: 768px) {
            body { padding: 20px; display: flex; justify-content: center; align-items: center; }
            .app-container { max-width: 900px; height: 90vh; border: 1px solid var(--border-color); border-radius: 24px; }
        }

        .header { padding: 10px 12px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; background: rgba(11, 15, 25, 0.6); }
        .header-top { display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-icon { width: 32px; height: 32px; background: var(--accent-gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .header-controls { display: flex; gap: 6px; }

        select { background: rgba(30, 41, 59, 0.8); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; }
        .clear-btn { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.72rem; }

        .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; position: relative; }
        .msg { max-width: 88%; padding: 12px 16px; border-radius: 16px; font-size: 0.92rem; line-height: 1.5; word-break: break-word; }
        .user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: var(--bot-msg); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }

        .code-block-wrapper { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .code-header { background: #1e293b; color: #94a3b8; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
        .code-actions { display: flex; gap: 4px; }
        .code-actions button { background: rgba(255, 255, 255, 0.1); color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; }
        .code-block-wrapper pre { margin: 0; padding: 12px; overflow-x: auto; font-size: 0.85rem; }

        .input-container { padding: 12px 16px; border-top: 1px solid var(--border-color); background: rgba(11, 15, 25, 0.6); display: flex; flex-direction: column; gap: 8px; }
        .input-wrapper { display: flex; align-items: center; gap: 8px; background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border-color); padding: 4px 4px 4px 12px; border-radius: 18px; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 0.92rem; }
        
        .action-icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; display: flex; align-items: center; }
        .send-btn { background: var(--accent-gradient); color: white; border: none; width: 42px; height: 42px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Animated Mic Button */
        .mic-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            position: relative;
        }

        .mic-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .mic-btn.listening {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
            animation: micPulse 1.5s infinite;
        }

        .mic-btn.listening svg {
            transform: scale(1.1);
        }

        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
        .modal-content { width: 100%; max-width: 800px; height: 80vh; background: #fff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { background: #1e293b; color: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; border: none; width: 100%; height: 100%; }

        #scrollBtn { display: none; position: absolute; bottom: 80px; right: 20px; background: var(--accent-gradient); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-top">
                <div class="brand">
                    <div class="brand-icon">✦</div>
                    <div class="brand-title">JepongDevxyz AI</div>
                </div>
                <button class="clear-btn" onclick="clearChat()">Clear</button>
            </div>
            <div class="header-controls">
                <select id="modeSelect">
                    <option value="general">🤖 Mode: General AI</option>
                    <option value="coder">💻 Mode: Expert Coder</option>
                    <option value="tagalog">🇵🇭 Mode: Pure Tagalog Friend</option>
                    <option value="affiliate">🛒 Mode: Affiliate Marketer</option>
                </select>
                <select id="modelSelect">
                    <option value="gemini-3.6-flash" selected>3.6 Flash</option>
                    <option value="gemini-3.7-extended-thinking">3.7 Thinking</option>
                </select>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <button id="scrollBtn" onclick="scrollToBottom()">↓</button>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="file" id="fileInput" hidden onchange="handleFileSelect(event)">
                <button class="action-icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="text" id="userInput" placeholder="Type a message or use mic..." onkeydown="if(event.key==='Enter') sendMessage()">
                
                <button class="mic-btn" id="micBtn" onclick="toggleSpeech()" aria-label="Voice Input">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>

                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <div class="modal" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Live Code Preview</span>
                <button onclick="closePreview()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1.2rem;">✕</button>
            </div>
            <iframe class="modal-body" id="previewFrame"></iframe>
        </div>
    </div>

    <script>
        let selectedFileData = null;
        let recognition = null;

        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            const codeContent = typeof code === 'object' ? code.text : code;
            const lang = language || 'html';
            const blockId = 'code-' + Math.random().toString(36).substring(2, 9);
            const isHTML = ['html', 'htm', 'xml'].includes(lang.toLowerCase());

            return `
                <div class="code-block-wrapper">
                    <div class="code-header">
                        <span>${lang}</span>
                        <div class="code-actions">
                            ${isHTML ? `<button onclick="previewLiveCode('${blockId}')">▶ Run / Play</button>` : ''}
                            <button onclick="copyCode('${blockId}', this)">📋 Copy</button>
                        </div>
                    </div>
                    <pre><code id="${blockId}" class="language-${lang}">${escapeHTML(codeContent)}</code></pre>
                </div>
            `;
        };
        marked.use({ renderer });

        const chatBox = document.getElementById('chatBox');
        const scrollBtn = document.getElementById('scrollBtn');
        chatBox.onscroll = () => {
            scrollBtn.style.display = (chatBox.scrollHeight - chatBox.scrollTop > 600) ? 'block' : 'none';
        };
        function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }

        function loadHistory() {
            const saved = localStorage.getItem('jepong_chat_history');
            if (saved) {
                chatBox.innerHTML += saved;
                document.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
            } else {
                chatBox.innerHTML += `<div class="msg bot">Hello! I am JepongDevxyz AI with full live preview, syntax highlighting, and voice support! How can I help you?</div>`;
            }
            scrollToBottom();
        }

        function saveHistory() {
            const scrollBtnBackup = document.getElementById('scrollBtn');
            scrollBtnBackup.remove();
            localStorage.setItem('jepong_chat_history', chatBox.innerHTML);
            chatBox.appendChild(scrollBtnBackup);
        }

        function clearChat() {
            if (confirm("Clear all chat history?")) {
                localStorage.removeItem('jepong_chat_history');
                location.reload();
            }
        }

        function previewLiveCode(blockId) {
            const code = document.getElementById(blockId).innerText;
            const modal = document.getElementById('previewModal');
            const frame = document.getElementById('previewFrame');
            modal.style.display = 'flex';
            frame.srcdoc = code;
        }
        function closePreview() { document.getElementById('previewModal').style.display = 'none'; }

        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]*>?/gm, ''));
            utterance.lang = 'tl-PH';
            window.speechSynthesis.speak(utterance);
        }

        function toggleSpeech() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Speech recognition is not supported on this browser.');
                return;
            }

            const micBtn = document.getElementById('micBtn');

            if (recognition) {
                recognition.stop();
                recognition = null;
                micBtn.classList.remove('listening');
                return;
            }

            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'tl-PH';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                micBtn.classList.add('listening');
            };

            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
                recognition = null;
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                recognition = null;
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                recognition = null;
            };

            recognition.start();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            const mode = document.getElementById('modeSelect').value;
            const model = document.getElementById('modelSelect').value;

            if (!message && !selectedFileData) return;

            let systemPrompts = {
                coder: "You are an expert Senior Full-stack Developer. Provide complete, fully functional code without placeholders.",
                tagalog: "Magsalita sa natural at kaswal na Tagalog lamang.",
                affiliate: "You are a TikTok Affiliate Marketing expert. Help with shop engagement and strategies.",
                general: "You are JepongDevxyz AI created by Jepong Devxyz."
            };

            const fullPrompt = `${systemPrompts[mode]}\n\nUser Question: ${message}`;

            chatBox.innerHTML += `<div class="msg user">${escapeHTML(message)}</div>`;
            input.value = '';
            scrollToBottom();

            const botMsgElem = document.createElement('div');
            botMsgElem.className = 'msg bot';
            botMsgElem.innerText = 'Thinking...';
            chatBox.appendChild(botMsgElem);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: fullPrompt, file: selectedFileData, model })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullResponse += decoder.decode(value, { stream: true });
                    botMsgElem.innerHTML = marked.parse(fullResponse) + `<button onclick="speakText(\`${escapeQuotes(fullResponse)}\`)" style="margin-top:6px; background:none; border:none; cursor:pointer;">🔊 Listen</button>`;
                    scrollToBottom();
                }

                document.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
                saveHistory();

            } catch (err) {
                botMsgElem.innerText = 'Connection Error.';
            }
        }

        function copyCode(blockId, btn) {
            navigator.clipboard.writeText(document.getElementById(blockId).innerText);
            btn.innerText = '✅ Copied!';
            setTimeout(() => btn.innerText = '📋 Copy', 2000);
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = (ex) => {
                selectedFileData = { mimeType: file.type, data: ex.target.result.split(',')[1] };
            };
            r.readAsDataURL(file);
        }

        function escapeHTML(s) { return s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t])); }
        function escapeQuotes(s) { return s.replace(/[`"'\\]/g, ''); }

        loadHistory();
    </script>
</body>
</html>
