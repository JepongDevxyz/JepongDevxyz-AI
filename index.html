<!DOCTYPE html>
<html lang="en">
<!-- Jay-Ar Lee Espiritu & JepongDevxyz AI -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <title>JepongDevxyz AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(21, 29, 45, 0.95);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --user-msg: rgba(30, 41, 59, 0.9);
            --bot-msg: transparent;
            --sig-good: #10b981;
            --sig-warn: #f59e0b;
            --sig-bad: #ef4444;
            --input-bg: #1f222a;
            --modal-bg: #151d2d;
            --bar-track: rgba(255, 255, 255, 0.08);
            --bar-fill: #e2e8f0;
            --drawer-width: 300px;
        }

        body.theme-light {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.96);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --user-msg: #e2e8f0;
            --input-bg: #ffffff;
            --modal-bg: #ffffff;
            --bar-track: rgba(0, 0, 0, 0.08);
            --bar-fill: #3b82f6;
        }

        body.theme-neon {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 20, 0.9);
            --text-main: #00ffcc;
            --text-muted: #00b399;
        }

        body.theme-sunset {
            --bg-color: #1a0b2e;
            --card-bg: rgba(45, 15, 64, 0.85);
            --text-main: #ffecd2;
            --text-muted: #d8b4fe;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
            outline: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        *::-webkit-scrollbar { display: none; width: 0; height: 0; }

        html, body { 
            width: 100vw; 
            max-width: 100vw;
            height: 100%; 
            height: 100dvh; 
            overflow: hidden !important; 
            overflow-x: hidden !important;
            overscroll-behavior: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
            touch-action: none;
            background-color: var(--bg-color); 
            color: var(--text-main); 
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .app-container { 
            width: 100%; 
            max-width: 100vw;
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            background: var(--card-bg); 
            position: relative; 
            overflow: hidden !important;
            overflow-x: hidden !important;
        }

        .header { 
            padding: 10px 14px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            background: rgba(11, 15, 25, 0.98); 
            position: relative;
            z-index: 20;
            flex-shrink: 0;
            width: 100%;
            overflow-x: hidden;
        }
        body.theme-light .header { background: rgba(255, 255, 255, 0.98); }
        
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
        
        .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; overflow: hidden; }
        .brand-icon { width: 34px; height: 34px; background: var(--accent-gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; cursor: pointer; border: none; }
        .brand-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .header-tools-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .network-status { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05); padding: 4px 8px; border-radius: 8px; font-size: 0.7rem; color: var(--text-muted); cursor: pointer; user-select: none; }

        .signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
        .bar { width: 2.5px; background-color: var(--sig-good); border-radius: 1px; transition: background-color 0.3s, opacity 0.3s; opacity: 0.3; }
        .bar-1 { height: 25%; } .bar-2 { height: 50%; } .bar-3 { height: 75%; } .bar-4 { height: 100%; }
        .bar.active { opacity: 1; }

        .header-btn { background: transparent; color: var(--text-main); border: none; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 0.72rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .clear-btn { color: #fca5a5; }

        .chat-search-bar {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 5px 8px;
            width: 100%;
            animation: modalPop 0.2s ease-out;
        }
        .chat-search-bar.active { display: flex; }
        .chat-search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.8rem;
        }
        .chat-search-count {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        mark.chat-highlight {
            background-color: #facc15;
            color: #000;
            border-radius: 2px;
            padding: 0 2px;
        }
        mark.chat-highlight.current {
            background-color: #f97316;
            color: #fff;
        }

        .header-controls { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.35fr); gap: 8px; width: 100%; align-items: center; }
        .header-controls .selector-wrapper { min-width: 0; width: 100%; }
        .header-controls .dropdown-btn { min-width: 0; overflow: hidden; }
        .header-controls .dropdown-btn > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #selectedModelText { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
        #selectedModeText { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @media (max-width: 430px) {
            .header-controls { grid-template-columns: minmax(0, .92fr) minmax(0, 1.35fr); gap: 6px; }
            .dropdown-btn { padding: 7px 8px; }
            .web-search-toggle-btn { padding: 7px 9px; }
            .model-selected-provider { display: none; }
        }
        @media (max-width: 360px) {
            .header-controls { grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr); }
            .web-search-toggle-btn span { display: none; }
            .web-search-toggle-btn { justify-content: center; }
        }
        .custom-prompt-input { flex: 1; background: rgba(30, 41, 59, 0.5); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; min-width: 100%; display: none; margin-top: 4px; }
        
        .selector-wrapper { position: relative; flex: 1; min-width: 0; }
        .dropdown-btn { width: 100%; background: rgba(30, 41, 59, 0.5); color: var(--text-main); border: 1px solid var(--border-color); padding: 7px 10px; border-radius: 8px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; gap: 4px; }
        .dropdown-title { display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; }
        body.theme-light .dropdown-btn { background: #e2e8f0; }

        .web-search-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            font-weight: 500;
            transition: 0.2s;
        }
        .web-search-toggle-btn.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            color: #10b981;
        }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; }
        .modal-overlay.open { display: flex; align-items: center; justify-content: center; }
        
        .floating-modal { background: var(--modal-bg); border: 1px solid var(--border-color); border-radius: 20px; width: 90%; max-width: 380px; padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: modalPop 0.2s ease-out; max-height: 85vh; overflow-y: auto; color: var(--text-main); }

        .dola-modal{max-width:400px;padding:20px;gap:14px;border-radius:24px;text-align:center;align-items:center}
        .dola-modal-head{display:flex;align-items:center;justify-content:space-between;width:100%}
        .dola-modal-title{flex:1;font-size:1.02rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-main);margin:0}
        .dola-modal-title i{width:19px;height:19px;color:#a855f7;flex-shrink:0}
        .dola-modal-close{background:rgba(255,255,255,.06);border:0;color:var(--text-muted);cursor:pointer;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
        .dola-modal-close:hover{background:rgba(255,255,255,.12);color:var(--text-main)}
        .dola-modal-close i{width:15px;height:15px}
        .dola-modal-desc{font-size:.8rem;color:var(--text-muted);line-height:1.5;margin:0;text-align:center}
        .dola-dropzone{width:100%;border:2px dashed rgba(168,85,247,.38);border-radius:18px;padding:26px 16px;text-align:center;cursor:pointer;transition:.15s ease;background:rgba(168,85,247,.04)}
        .dola-dropzone:hover{border-color:rgba(168,85,247,.65);background:rgba(168,85,247,.08)}
        .dola-preview-img{max-height:150px;max-width:100%;border-radius:12px;object-fit:contain}
        .dola-drop-text{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:.82rem;color:var(--text-muted)}
        .dola-drop-text i{width:30px;height:30px;color:#a855f7;opacity:.85}
        .dola-prompt-input{width:100%;min-height:78px;background:rgba(255,255,255,.03);border:1px solid var(--border-color);border-radius:14px;padding:12px;font-size:.84rem;color:var(--text-main);resize:none;font-family:inherit}
        .dola-prompt-input:focus{outline:none;border-color:rgba(168,85,247,.55)}
        .dola-submit-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent-gradient);color:#fff;border:none;padding:13px;border-radius:14px;font-weight:700;font-size:.9rem;cursor:pointer}
        .dola-submit-btn:hover{filter:brightness(1.08)}
        .dola-submit-btn i{width:17px;height:17px}
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .option-item { background: transparent; border: none; border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); width: 100%; }
        .option-item.active { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); }
        .option-info { display: flex; align-items: center; gap: 10px; }
        .option-name { font-weight: 600; font-size: 0.88rem; display: flex; align-items: center; gap: 8px; }
        .option-desc { font-size: 0.72rem; color: var(--text-muted); }
        .radio-icon { width: 18px; height: 18px; border: 2px solid var(--text-muted); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .option-item.active .radio-icon { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.2); box-shadow: inset 0 0 0 3px #8b5cf6; }
        .divider { height: 1px; background: var(--border-color); margin: 6px 0; }
.speech-settings-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 4px 0;
            transition: opacity 0.3s, filter 0.3s;
        }
        .speech-settings-group.disabled {
            opacity: 0.35;
            pointer-events: none;
            filter: grayscale(0.8);
            user-select: none;
        }
        .modern-select-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .speed-slider-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .modern-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        .modern-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
        }

        .usage-section { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 4px; }
        .usage-title { font-size: 0.78rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.5px; text-align: center; }
        .usage-metric-card { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .metric-box h5 { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
        .metric-box p { font-size: 0.95rem; font-weight: 700; color: #8b5cf6; }

        .usage-limits-deck { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .limit-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
        .limit-card-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; font-weight: 600; }
        .limit-title-wrap { display: flex; align-items: center; gap: 6px; }
        .info-circle { width: 14px; height: 14px; border: 1.5px solid var(--text-muted); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.65rem; color: var(--text-muted); }
        .limit-percent { font-weight: 600; font-size: 0.85rem; color: var(--text-main); }
        
        .progress-track { width: 100%; height: 6px; background: var(--bar-track); border-radius: 6px; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; background: var(--bar-fill); border-radius: 6px; width: 0%; transition: width 0.4s ease; }
        .limit-card-footer { font-size: 0.72rem; color: var(--text-muted); }

        /* BI-DIRECTIONAL SIDE & BOTTOM DRAWER */
        .sidebar-overlay { 
            display: block;
            pointer-events: none;
            opacity: 0;
            position: absolute; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.65); 
            backdrop-filter: blur(4px); 
            z-index: 900; 
            transition: opacity 0.3s cubic-bezier(0.2, 0, 0, 1);
            will-change: opacity;
        }
        .sidebar-overlay.open { 
            pointer-events: auto;
            opacity: 1; 
        }

        .sidebar {
            position: absolute;
            width: var(--drawer-width);
            max-width: 85vw;
            height: 100%;
            min-height: 0;
            top: 0;
            background: #0f172a;
            z-index: 901;
            display: flex;
            flex-direction: column;
            padding: 18px 16px max(16px, env(safe-area-inset-bottom));
            gap: 14px;
            overflow: hidden;
            overscroll-behavior: contain;
            will-change: transform;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 0 35px rgba(0,0,0,0.6);
        }

        .sidebar.drawer-left {
            left: 0; right: auto;
            border-right: 1px solid var(--border-color);
            border-top-right-radius: 28px;
            border-bottom-right-radius: 28px;
            transform: translateX(-100%);
        }
        .sidebar.drawer-left.open { transform: translateX(0); }

        .sidebar.drawer-right {
            left: auto; right: 0;
            border-left: 1px solid var(--border-color);
            border-top-left-radius: 28px;
            border-bottom-left-radius: 28px;
            transform: translateX(100%);
        }
        .sidebar.drawer-right.open { transform: translateX(0); }

        .sidebar.drawer-bottom {
            top: auto; bottom: 0; left: 0; right: 0;
            width: 100%; max-width: 100vw;
            height: min(75dvh, calc(var(--jepong-vh, 100dvh) - 10px));
            max-height: calc(var(--jepong-vh, 100dvh) - 10px);
            border-top: 1px solid var(--border-color);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            transform: translateY(100%);
        }
        .sidebar.drawer-bottom.open { transform: translateY(0); }

        body.theme-light .sidebar { background: #ffffff; }

        .bottom-sheet-drag-handle {
            width: 44px;
            height: 5px;
            background: var(--text-muted);
            opacity: 0.4;
            border-radius: 10px;
            margin: 0 auto 4px auto;
            cursor: grab;
            flex-shrink: 0;
        }

        .sidebar-header { position: relative; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .sidebar-header h3 { font-size: 0.95rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .close-sidebar-btn { position: absolute; right: 0; background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .new-chat-btn { background: var(--accent-gradient); color: #fff; border: none; padding: 10px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        .search-bar-wrap { position: relative; display: flex; align-items: center; width: 100%; }
        .search-bar-wrap svg { position: absolute; left: 10px; color: var(--text-muted); pointer-events: none; }
        .search-chat-input { background: rgba(30, 41, 59, 0.5); border: none; color: var(--text-main); padding: 8px 12px 8px 32px; border-radius: 8px; font-size: 0.8rem; width: 100%; border: 1px solid var(--border-color); }
        body.theme-light .search-chat-input { background: #e2e8f0; }

        .sidebar-header,
        .new-chat-btn,
        .search-bar-wrap { flex-shrink: 0; }

        .chat-history-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        .history-item { 
            background: transparent; 
            border: none; 
            border-radius: 8px; 
            padding: 8px 10px; 
            font-size: 0.82rem; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 6px; 
            color: var(--text-main); 
            transition: background 0.2s;
        }
        .history-item.active { background: rgba(99, 102, 241, 0.15); }
        .history-item:hover { background: rgba(255, 255, 255, 0.05); }
        .history-item-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
        
        .history-actions-deck {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .hist-action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
            transition: 0.15s;
        }
        .hist-action-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }
        .hist-action-btn.pin-btn.pinned { color: #f59e0b; }

        #sidebar-footer-settings {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            flex-shrink:0;
            min-height:52px;
            padding:12px 2px 2px;
            border-top:1px solid var(--border-color);
            background:linear-gradient(180deg, rgba(15,23,42,0), rgba(15,23,42,.96) 24%);
        }
        body.theme-light #sidebar-footer-settings { background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.98) 24%); }
        .sidebar-word-pill {
            display:inline-flex;
            align-items:center;
            gap:7px;
            min-width:0;
            padding:7px 10px;
            border-radius:999px;
            border:1px solid var(--border-color);
            background:rgba(255,255,255,.04);
            color:var(--text-muted);
            font-size:12px;
            white-space:nowrap;
        }
        .sidebar-word-pill b { color:var(--text-main); font-size:12px; }
        body.theme-light .sidebar-word-pill { background:rgba(15,23,42,.04); }

        .chat-viewport-wrapper {
            flex: 1 1 auto;
            position: relative;
            min-height: 0;
            width: 100%;
