<script>
function updateWordCounter(text) {
  const currentCount = parseInt(localStorage.getItem('jepong_word_count') || '0');
  const wordsInText = text.trim().split(/\s+/).length;
  const newTotal = currentCount + wordsInText;
  localStorage.setItem('jepong_word_count', newTotal);
  document.getElementById('word-count').innerText = newTotal;
}

function setTheme(themeName) {
  document.body.className = themeName;
  localStorage.setItem('jepong_theme', themeName);
}

window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('jepong_theme') || '';
  if (savedTheme) document.body.className = savedTheme;
  const savedWordCount = localStorage.getItem('jepong_word_count') || '0';
  const wordCountElem = document.getElementById('word-count');
  if (wordCountElem) wordCountElem.innerText = savedWordCount;
});
</script>

    <!-- Modern Custom Alert Popup -->

    <!-- DYNAMIC COMMANDS MODAL -->
    <div class="modal-overlay" id="commandsModalOverlay" onclick="if(event.target === this) toggleCommandsModal(false)">
        <div class="commands-modal-content">
            <div class="preview-modal-header">
                <span id="commandsModalTitle" style="font-weight: 600; color: #fff;">⚡ Available Commands</span>
                <button class="preview-close-btn" onclick="toggleCommandsModal(false)" style="cursor: pointer; background: none; border: none; color: #aaa; font-size: 1.1rem;">✕ Close</button>

    <div class="image-lightbox-overlay" id="imageLightbox" onclick="closeLightbox()">
        <img class="image-lightbox-content" id="lightboxImg">

    <script>
        let selectedFilesData = [];
        let chatSessions = JSON.parse(localStorage.getItem('jepong_ai_chats') || '{}');
        let currentSessionId = null;
        let currentSelectedModel = 'gemini-3.6-flash';
        let currentSelectedMode = 'general';
        let isIncognito = false;
        let inactivityTimer = null;
        let isRecording = false;
        let recognition = null;
        let userScrolledUp = false;
        let systemVoices = [];

        // BIBLE MODE SYSTEM & STORAGE STATE
        let isBibleMode = false;
        let bibleChatSessions = JSON.parse(localStorage.getItem('jepong_bible_chats') || '{}');
        let currentBibleSessionId = null;

        function showAlert(message, title = 'Notice', icon = '💡') {
            document.getElementById('customAlertTitle').innerText = title;
            document.getElementById('customAlertMessage').innerText = message;
            document.getElementById('customAlertIcon').innerText = icon;
            document.getElementById('customAlertOverlay').classList.add('open');
        }

        function closeCustomAlert() {
            document.getElementById('customAlertOverlay').classList.remove('open');
        }

        function resetInactivityTimer() {
            if (!isIncognito) return;
            if (inactivityTimer) clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                showAlert('Incognito session expired due to 30 minutes of inactivity.', 'Session Expired', '⏳');
                setTimeout(() => window.location.reload(), 2000);
            }, 30 * 60 * 1000);
        }

        window.addEventListener('mousemove', resetInactivityTimer);
        window.addEventListener('keydown', resetInactivityTimer);
        window.addEventListener('click', resetInactivityTimer);

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            systemVoices = window.speechSynthesis.getVoices();
        }

        loadVoices();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            const codeContent = typeof code === 'object' ? code.text : code;
            const lang = language || 'code';
            const blockId = 'code-' + Math.random().toString(36).substring(2, 9);
            return `
                <div class="code-block-wrapper">
                    <div class="code-header">
                        <span>${lang}</span>
                        <div class="code-actions">
                            <button onclick="runCode('${blockId}')">▶ Run</button>
                            <button onclick="copyCode('${blockId}', this)">📋 Copy</button>
                        </div>
                    </div>
                    <pre><code id="${blockId}" class="language-${lang}">${escapeHTML(codeContent)}</code></pre>
                </div>
            `;
        };
        marked.use({ renderer });

        const chatBox = document.getElementById('chatBox');

        function saveSessions() {
            if (isIncognito) return;
            localStorage.setItem('jepong_ai_chats', JSON.stringify(chatSessions));
            renderSidebarHistory();
        }

        chatBox.addEventListener('scroll', () => {
            const scrollBtn = document.getElementById('scrollBtn');
            const isNearBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 100;
            if (scrollBtn) scrollBtn.style.display = !isNearBottom ? 'block' : 'none';
            userScrolledUp = !isNearBottom;
        });

        function scrollToBottom(forced = false) {
            if (forced || !userScrolledUp) {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function toggleModal(modalId, show) {
            document.getElementById(modalId).classList.toggle('open', show);
        }

        // Dynamic Commands Modal Handler
        function toggleCommandsModal(show) {
            const modal = document.getElementById('commandsModalOverlay');
            const container = document.getElementById('commandsListContainer');
            const title = document.getElementById('commandsModalTitle');

            if (!modal || !container || !title) return;

            if (show) {
                if (isBibleMode) {
                    title.innerText = '📖 Bible Mode Commands';
                    container.innerHTML = `
                        <div class="command-row"><span class="command-name" style="color: #f59e0b; font-weight: bold;">/story [topic/person]</span><span class="command-desc"> - Ikwento nang buo at lively ang kwento mula sa Biblia (auto Text-To-Speech).</span></div>
                        <div class="command-row"><span class="command-name" style="color: #f59e0b; font-weight: bold;">/verse [verse]</span><span class="command-desc"> - Kukuha ng salin (NIV/Tagalog) at magbibigay ng malalim na paliwanag.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #f59e0b; font-weight: bold;">/pray [topic]</span><span class="command-desc"> - Gagawan ka ng taos-pusong panalangin na may kaugnay na talata.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #f59e0b; font-weight: bold;">/bnew</span><span class="command-desc"> - Magbubukas ng bagong Bible conversation thread.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #f59e0b; font-weight: bold;">/bclear</span><span class="command-desc"> - Buburahin ang saved history sa Bible Mode lamang.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #f59e0b; font-weight: bold;">/commands</span><span class="command-desc"> - Ipapakita ang listahang ito ng Bible commands.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #f59e0b; font-weight: bold;">/exit</span><span class="command-desc"> - Lalabas sa Bible Mode at babalik sa Normal Mode (safe at naka-save ang Bible history).</span></div>
                    `;
                } else {
                    title.innerText = '⚡ Normal Slash Commands';
                    container.innerHTML = `
                        <div class="command-row"><span class="command-name" style="color: #3b82f6; font-weight: bold;">/bible [topic]</span><span class="command-desc"> - Magbubukas ng Dedicated Bible Mode Tab (hiwalay ang storage at may auto Text-To-Speech).</span></div>
                        <div class="command-row"><span class="command-name" style="color: #3b82f6; font-weight: bold;">/newchat</span><span class="command-desc"> - Gumagawa ng bagong conversation tab.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #3b82f6; font-weight: bold;">/delete</span><span class="command-desc"> - Buburahin ang kasalukuyang active conversation.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #3b82f6; font-weight: bold;">/refresh</span><span class="command-desc"> - Irerefresh ang buong website.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #3b82f6; font-weight: bold;">/clearcache</span><span class="command-desc"> - Buburahin ang lahat ng saved chats sa localStorage.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #3b82f6; font-weight: bold;">/incognito</span><span class="command-desc"> - Magbubukas ng pribadong session (walang save).</span></div>
                        <div class="command-row"><span class="command-name" style="color: #3b82f6; font-weight: bold;">/exit</span><span class="command-desc"> - Lalabas sa incognito mode pabalik sa normal mode.</span></div>
                        <div class="command-row"><span class="command-name" style="color: #3b82f6; font-weight: bold;">/commands</span><span class="command-desc"> - Ipapakita ang listahang ito ng Normal commands.</span></div>
                    `;
                }
            }

            modal.classList.toggle('open', show);
        }

        function selectMode(modeKey, modeDisplayName) {
            currentSelectedMode = modeKey;
            document.getElementById('selectedModeText').innerText = modeDisplayName;
            const modal = document.getElementById('modeModalOverlay');
            modal.querySelectorAll('.option-item').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(modeKey)) btn.classList.add('active');
            });
            toggleModal('modeModalOverlay', false);
            document.getElementById('customPromptInput').style.display = modeKey === 'custom' ? 'block' : 'none';
        }

        function selectModel(modelKey, modelDisplayName) {
            currentSelectedModel = modelKey;
            document.getElementById('selectedModelText').innerText = modelDisplayName;
            const modal = document.getElementById('modelModalOverlay');
            modal.querySelectorAll('.option-item').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(modelKey)) btn.classList.add('active');
            });
            toggleModal('modelModalOverlay', false);
        }

        function renderWelcomeScreen() {
            chatBox.innerHTML = `
                <div class="welcome-screen">
                    <lottie-player class="welcome-lottie-top" src="https://lottie.host/035962ae-ec85-4735-ac5b-3a3764108916/y2Kb1ZKXAi.json" background="transparent" speed="1" loop autoplay></lottie-player>
                    <div class="welcome-title">${isIncognito ? '🕵️‍♂️ Incognito Mode' : 'JepongDevxyz AI'}</div>
                    <lottie-player class="welcome-lottie-bottom" src="https://lottie.host/2477a7dc-71fb-4c1b-ab00-e006ead8ebe6/Ydd9GqGGLm.json" background="transparent" speed="1" loop autoplay></lottie-player>
                </div>
                <button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>
            `;
            userScrolledUp = false;
        }

        function toggleSidebar(show) {
            if (isIncognito) {
                showAlert('Sidebar history is disabled in Incognito mode.', 'Incognito Mode', '🕵️‍♂️');
                return;
            }
            document.getElementById('sidebar').classList.toggle('open', show);
            document.getElementById('sidebarOverlay').classList.toggle('open', show);
            if (show) renderSidebarHistory();
        }

        function createNewChat() {
            if (isBibleMode) {
                createBibleChatSession();
                return;
            }
            if (isIncognito) {
                showAlert('You are currently in Incognito mode. Type /exit to return to normal mode.', 'Incognito Active', '🕵️‍♂️');
                return;
            }
            document.getElementById('brandTitleText').innerText = 'JepongDevxyz AI';
            currentSessionId = 'session_' + Date.now();
            chatSessions[currentSessionId] = { id: currentSessionId, title: 'New Conversation', messages: [] };
            saveSessions();
            renderWelcomeScreen();
            toggleSidebar(false);
        }

        function startIncognitoChat() {
            if (isIncognito) {
                showAlert('You are already in Incognito mode.', 'Notice', '🕵️‍♂️');
                return;
            }
            isIncognito = true;
            document.getElementById('brandTitleText').innerText = 'JepongDevxyz AI';
            currentSessionId = 'incognito_' + Date.now();
            chatSessions = {};
            renderWelcomeScreen();
            toggleSidebar(false);
            resetInactivityTimer();
        }

        function exitIncognitoChat() {
            if (!isIncognito) {
                showAlert('You are not in any mode.', 'Notice', 'ℹ️');
                return;
            }
            isIncognito = false;
            document.getElementById('brandTitleText').innerText = 'JepongDevxyz AI';
            if (inactivityTimer) clearTimeout(inactivityTimer);
            chatSessions = JSON.parse(localStorage.getItem('jepong_ai_chats') || '{}');
            if (Object.keys(chatSessions).length > 0) {
                loadChatSession(Object.keys(chatSessions)[Object.keys(chatSessions).length - 1]);
            } else {
                createNewChat();
            }
        }

        function loadChatSession(id) {
            if (isIncognito) return;
            currentSessionId = id;
            const session = chatSessions[id];
            if (!session) return;

            if (session.messages.length === 0) {
                renderWelcomeScreen();
            } else {
                chatBox.innerHTML = '<button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>';
                session.messages.forEach(msg => {
                    if (msg.role === 'user') {
                        let attHTML = '';
                        if (msg.files && msg.files.length > 0) {
                            msg.files.forEach(file => {
                                if (file.mimeType.startsWith('image/')) {
                                    attHTML += `<div style="margin-top: 4px;"><img src="${file.fullData}" onclick="openLightbox('${file.fullData}')" style="max-width: 220px; max-height: 220px; border-radius: 12px; border: 1px solid var(--border-color); object-fit: cover; display: block; cursor: pointer;"></div>`;
                                } else {
                                    attHTML += `<div style="margin-top: 4px; font-size: 0.8rem; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border-color);">📄 ${escapeHTML(file.name)}</div>`;
                                }
                            });
                        }
                        const hasText = msg.text && msg.text.trim().length > 0;
                        const bubbleClass = hasText ? 'msg user has-bubble' : 'msg user no-bubble';
                        const content = (hasText ? `<div>${escapeHTML(msg.text)}</div>` : '') + attHTML;
                        chatBox.innerHTML += `<div class="${bubbleClass}">${content}</div>`;
                    } else {
                        const botDiv = document.createElement('div');
                        botDiv.className = 'msg bot';
                        botDiv.innerHTML = `<div>${marked.parse(msg.text)}</div>
                            <div class="bot-actions">
                                <button class="bot-action-btn" onclick="speakText(this)">🔊 Listen</button>
                                <button class="bot-action-btn" onclick="copyText(this)">📋 Copy</button>
                            </div>`;
                        chatBox.appendChild(botDiv);
                    }
                });
                chatBox.querySelectorAll('.msg img').forEach(img => {
                    img.onclick = () => openLightbox(img.src);
                });
                document.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
            }
            scrollToBottom(true);
            toggleSidebar(false);
            renderSidebarHistory();
        }

        function deleteChatSession(id, e) {
            if(e) e.stopPropagation();
            if (isIncognito) {
                showAlert('Command not available in Incognito mode.', 'Incognito Active', '🕵️‍♂️');
                return;
            }
            delete chatSessions[id];
            saveSessions();
            if (currentSessionId === id) createNewChat();
        }

        function renderSidebarHistory(filter = '') {
            if (isIncognito) return;
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = '';
            Object.values(chatSessions).reverse().forEach(session => {
                if (filter && !session.title.toLowerCase().includes(filter.toLowerCase())) return;
                const item = document.createElement('div');
                item.className = 'history-item' + (session.id === currentSessionId ? ' active' : '');
                item.onclick = () => loadChatSession(session.id);
                item.innerHTML = `
                    <span class="history-item-text">${escapeHTML(session.title)}</span>
                    <button class="delete-hist-btn" onclick="deleteChatSession('${session.id}', event)">🗑️</button>
                `;
                list.appendChild(item);
            });
        }

        function filterChatHistory() {
            renderSidebarHistory(document.getElementById('searchChatInput').value);
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            Array.from(files).forEach(file => {
                const r = new FileReader();
                r.onload = (ex) => {
                    selectedFilesData.push({
                        name: file.name,
                        mimeType: file.type,
                        data: ex.target.result.split(',')[1],
                        fullData: ex.target.result
                    });
                    renderFilePreviews();
                };
                r.readAsDataURL(file);
            });
        }

        function renderFilePreviews() {
            const container = document.getElementById('filePreviewContainer');
            container.innerHTML = '';
            if (selectedFilesData.length === 0) { container.style.display = 'none'; return; }
            container.style.display = 'flex';
            selectedFilesData.forEach((file, index) => {
                const chip = document.createElement('div');
                chip.className = file.mimeType.startsWith('image/') ? 'gemini-chip img-chip' : 'gemini-chip';
                chip.innerHTML = file.mimeType.startsWith('image/') 
                    ? `<img src="${file.fullData}"><button class="chip-close-btn" onclick="removeFile(${index})">✕</button>`
                    : `<span>📄 ${escapeHTML(file.name)}</span><button class="chip-close-btn" onclick="removeFile(${index})">✕</button>`;
                container.appendChild(chip);
            });
        }

        function removeFile(index) {
            selectedFilesData.splice(index, 1);
            renderFilePreviews();
        }

        // ==========================================
        // BIBLE MODE SYSTEM LOGIC
        // ==========================================
        function handleBibleCommands(message) {
            const cmdLine = message.trim();
            const parts = cmdLine.split(' ');
            const mainCmd = parts[0].toLowerCase();
            const args = parts.slice(1).join(' ');

            if (mainCmd === '/exit') {
                exitBibleMode();
                return true;
            }

            if (mainCmd === '/bnew') {
                createBibleChatSession();
                return true;
            }

            if (mainCmd === '/bclear') {
                localStorage.removeItem('jepong_bible_chats');
                bibleChatSessions = {};
                createBibleChatSession();
                showAlert('Nabura na ang lahat ng history sa Bible Mode.', 'Bible Storage Cleared', '🧹');
                return true;
            }

            if (mainCmd === '/commands' || mainCmd === '/bcommands') {
                toggleCommandsModal(true);
                return true;
            }

            if (mainCmd === '/verse') {
                if (!args) {
                    showAlert('Maglagay ng verse pagkatapos ng command.\nHalimbawa: /verse John 3:16', 'Bible Command', '📖');
                    return true;
                }
                processBiblePrompt(`Magbigay ng malalim na paliwanag, eksaktong teksto (Tagalog/English), at life application para sa verse na ito: ${args}`);
                return true;
            }

            if (mainCmd === '/story') {
                if (!args) {
                    showAlert('Maglagay ng pangalan ng tauhan o kwento.\nHalimbawa: /story Kwento ni David at Goliath', 'Bible Command', '📜');
                    return true;
                }
                processBiblePrompt(`Ikwento mo nang buo, detalyado, at lively ang kwentong ito mula sa Biblia na parang isang master storyteller: ${args}`);
                return true;
            }

            if (mainCmd === '/pray') {
                const topic = args || 'pangkalahatang gabay at kapayapaan';
                processBiblePrompt(`Gumawa ng isang taos-pusong panalangin (prayer) base sa paksang ito: ${topic}. Isama rin ang angkop na Bible verse.`);
                return true;
            }

            return false;
        }

        function startBibleMode(initialTopic = '') {
            isBibleMode = true;
            const titleElem = document.getElementById('brandTitleText');
            if (titleElem) titleElem.innerText = 'JepongDevxyz AI';
            
            bibleChatSessions = JSON.parse(localStorage.getItem('jepong_bible_chats') || '{}');
            
            if (Object.keys(bibleChatSessions).length > 0) {
                currentBibleSessionId = Object.keys(bibleChatSessions)[Object.keys(bibleChatSessions).length - 1];
                loadBibleSession(currentBibleSessionId);
            } else {
                createBibleChatSession();
            }

            if (initialTopic) {
                processBiblePrompt(initialTopic);
            } else {
                showAlert('Nasa dedicated Bible Mode ka na!\nType /commands para sa mga commands.', '📖 Bible Mode', '🕊️');
            }
        }

        function exitBibleMode() {
            if (!isBibleMode) return;
            isBibleMode = false;
            const titleElem = document.getElementById('brandTitleText');
            if (titleElem) titleElem.innerText = 'JepongDevxyz AI';
            
            chatSessions = JSON.parse(localStorage.getItem('jepong_ai_chats') || '{}');
            if (Object.keys(chatSessions).length > 0) {
                loadChatSession(Object.keys(chatSessions)[Object.keys(chatSessions).length - 1]);
            } else {
                createNewChat();
            }
            showAlert('Nakalabas ka na sa Bible Mode. Safe at saved pa rin ang dati mong Bible topics pagbalik mo!', 'Normal Mode', '🔙');
        }

        function createBibleChatSession() {
            currentBibleSessionId = 'bsession_' + Date.now();
            bibleChatSessions[currentBibleSessionId] = { id: currentBibleSessionId, title: 'Bible Session', messages: [] };
            saveBibleSessions();
            renderBibleWelcomeScreen();
        }

        function saveBibleSessions() {
            localStorage.setItem('jepong_bible_chats', JSON.stringify(bibleChatSessions));
        }

        function loadBibleSession(id) {
            currentBibleSessionId = id;
            const session = bibleChatSessions[id];
            if (!session || !chatBox) return;

            if (session.messages.length === 0) {
                renderBibleWelcomeScreen();
            } else {
                chatBox.innerHTML = '<button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>';
                session.messages.forEach(msg => {
                    if (msg.role === 'user') {
                        chatBox.innerHTML += `<div class="msg user has-bubble"><div>${escapeHTML(msg.text)}</div></div>`;
                    } else {
                        const botDiv = document.createElement('div');
                        botDiv.className = 'msg bot';
                        botDiv.innerHTML = `<div>${marked.parse(msg.text)}</div>
                            <div class="bot-actions" style="margin-top: 8px; display: flex; gap: 8px;">
                                <button class="bot-action-btn" onclick="speakRawText(this.parentElement.previousElementSibling.innerText)">🔊 Replay Audio</button>
                            </div>`;
                        chatBox.appendChild(botDiv);
                    }
                });
            }
            scrollToBottom(true);
        }

        function renderBibleWelcomeScreen() {
            if (!chatBox) return;
            chatBox.innerHTML = `
                <div class="welcome-screen" style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 3.5rem; margin-bottom: 8px;">📖🕊️</div>
                    <div class="welcome-title" style="font-size: 1.5rem; font-weight: bold; background: linear-gradient(90deg, #f59e0b, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Bible Scholar & Storyteller</div>
                    <p style="color: #aaa; font-size: 0.85rem; margin-top: 8px; max-width: 320px; margin-left: auto; margin-right: auto;">
                        I-type ang iyong paksa o gumamit ng commands tulad ng <b>/story</b>, <b>/verse</b>, o <b>/pray</b>. Naka-auto Text-to-Speech ang bawat sagot!
                    </p>
                </div>
                <button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>
            `;
        }

        async function processBiblePrompt(userText) {
            if (!chatBox) return;

            if (!currentBibleSessionId || !bibleChatSessions[currentBibleSessionId]) {
                createBibleChatSession();
            }

            if (bibleChatSessions[currentBibleSessionId].messages.length === 0) {
                chatBox.innerHTML = '<button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>';
                bibleChatSessions[currentBibleSessionId].title = userText.substring(0, 25);
            }

            chatBox.innerHTML += `<div class="msg user has-bubble"><div>${escapeHTML(userText)}</div></div>`;
            bibleChatSessions[currentBibleSessionId].messages.push({ role: 'user', text: userText });
            saveBibleSessions();

            const botMsgElem = document.createElement('div');
            botMsgElem.className = 'msg bot';
            botMsgElem.innerText = 'Naghahanap sa Banal na Kasulatan...';
            chatBox.appendChild(botMsgElem);
            scrollToBottom(true);

            const bibleSystemInstruction = "You are a warm, wise, and highly articulate Biblical Scholar and Master Storyteller. Your purpose is to explain Bible verses, tell vivid biblical stories, provide context, and offer prayers/reflections. ALWAYS detect the language of the user (Tagalog/Filipino or English) and reply FULLY in that language. Ensure your responses sound fluid and natural when read aloud via Text-to-Speech.";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: userText, 
                        files: [], 
                        model: currentSelectedModel || 'gemini-3.6-flash', 
                        mode: 'custom', 
                        customPrompt: bibleSystemInstruction 
                    })
                });

                if (!response.ok) throw new Error('Failed to connect to AI');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullResponse += decoder.decode(value, { stream: true });
                    botMsgElem.innerHTML = `<div>${marked.parse(fullResponse)}</div>
                        <div class="bot-actions" style="margin-top: 8px; display: flex; gap: 8px;">
                            <button class="bot-action-btn" onclick="speakRawText(this.parentElement.previousElementSibling.innerText)">🔊 Replay Audio</button>
                        </div>`;
                    scrollToBottom(false);
                }

                bibleChatSessions[currentBibleSessionId].messages.push({ role: 'bot', text: fullResponse });
                saveBibleSessions();

                updateWordCounter(userText + ' ' + fullResponse);
                speakRawText(fullResponse);

            } catch (err) {
                botMsgElem.innerHTML = `<div class="minimal-error-card"><span class="minimal-error-text">⚠️ ${escapeHTML(err.message)}</span></div>`;
            }
        }

        // ==========================================
        // MAIN SEND MESSAGE DISPATCHER
        // ==========================================
        async function sendMessage() {
            const input = document.getElementById('userInput');
            if (!input) return;
            const message = input.value.trim();
            if (!message && selectedFilesData.length === 0) return;

            if (message.toLowerCase() === '/commands') {
                input.value = '';
                toggleCommandsModal(true);
                return;
            }

            if (!isBibleMode && message.toLowerCase().startsWith('/bible')) {
                const topic = message.replace(/\/bible/i, '').trim();
                input.value = '';
                startBibleMode(topic);
                return;
            }

            if (isBibleMode) {
                input.value = '';
                const isCmd = handleBibleCommands(message);
                if (!isCmd) {
                    processBiblePrompt(message);
                }
                return;
            }

            // Normal Mode Slash Commands
            if (message.startsWith('/')) {
                const cmd = message.toLowerCase();
                input.value = '';
                
                if (cmd === '/newchat') {
                    createNewChat();
                    return;
                } else if (cmd === '/delete') {
                    if (isIncognito) {
                        showAlert('You are in Incognito mode. Type /exit to leave.', 'Incognito Mode', '🕵️‍♂️');
                    } else if (currentSessionId) {
                        deleteChatSession(currentSessionId);
                    }
                    return;
                } else if (cmd === '/refresh') {
                    window.location.reload();
                    return;
                } else if (cmd === '/clearcache') {
                    if (isIncognito) {
                        showAlert('Cannot clear cache while in Incognito mode.', 'Incognito Mode', '🕵️‍♂️');
                        return;
                    }
                    localStorage.removeItem('jepong_ai_chats');
                    chatSessions = {};
                    createNewChat();
                    return;
                } else if (cmd === '/incognito') {
                    startIncognitoChat();
                    return;
                } else if (cmd === '/exit') {
                    exitIncognitoChat();
                    return;
                } else {
                    showAlert('Unknown command: ' + message + '\nType /commands to see available commands.', 'Command Error', '⚠️');
                    return;
                }
            }

            const mode = currentSelectedMode;
            const model = currentSelectedModel;

            if (!isIncognito && (!currentSessionId || !chatSessions[currentSessionId])) createNewChat();
            if (isIncognito && !chatSessions[currentSessionId]) {
                chatSessions[currentSessionId] = { id: currentSessionId, title: 'Incognito', messages: [] };
            }

            const tempFiles = [...selectedFilesData];

            if (chatSessions[currentSessionId].messages.length === 0) {
                chatBox.innerHTML = '<button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>';
                chatSessions[currentSessionId].title = message ? message.substring(0, 25) : (tempFiles.length > 0 ? tempFiles[0].name : 'Attachment');
            }

            userScrolledUp = false;

            let attachmentsHTML = '';
            tempFiles.forEach(file => {
                if (file.mimeType.startsWith('image/')) {
                    attachmentsHTML += `<div style="margin-top: 4px;"><img src="${file.fullData}" onclick="openLightbox('${file.fullData}')" style="max-width: 220px; max-height: 220px; border-radius: 12px; border: 1px solid var(--border-color); object-fit: cover; display: block; cursor: pointer;"></div>`;
                } else {
                    attachmentsHTML += `<div style="margin-top: 4px; font-size: 0.8rem; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border-color);">📄 ${escapeHTML(file.name)}</div>`;
                }
            });

            const hasText = message.length > 0;
            const bubbleClass = hasText ? 'msg user has-bubble' : 'msg user no-bubble';
            const userBubbleContent = (hasText ? `<div>${escapeHTML(message)}</div>` : '') + attachmentsHTML;

            chatBox.innerHTML += `<div class="${bubbleClass}">${userBubbleContent}</div>`;
            
            chatSessions[currentSessionId].messages.push({ 
                role: 'user', 
                text: message, 
                files: tempFiles.map(f => ({ name: f.name, mimeType: f.mimeType, fullData: f.fullData })) 
            });
            saveSessions();

            input.value = '';
            selectedFilesData = [];
            renderFilePreviews();

            const botMsgElem = document.createElement('div');
            botMsgElem.className = 'msg bot';
            botMsgElem.innerText = mode === 'imagen' ? 'Generating image with Imagen 4...' : 'Thinking...';
            chatBox.appendChild(botMsgElem);
            scrollToBottom(true);

            const customPrompt = document.getElementById('customPromptInput').value;

            try {
                if (mode === 'imagen') {
                    const res = await fetch('/api/generate-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: message })
                    });
                    
                    const rawText = await res.text();
                    let data;
                    try {
                        data = JSON.parse(rawText);
                    } catch (pErr) {
                        throw new Error(`Server returned invalid JSON: ${rawText.substring(0, 80)}`);
                    }

                    if (!res.ok || !data.success) {
                        throw new Error(data.error || 'Failed to generate image');
                    }

                    const imgHtml = `<div><img src="${data.imageUrl}" onclick="openLightbox('${data.imageUrl}')" style="max-width: 100%; border-radius: 12px; border: 1px solid var(--border-color); cursor: pointer;"></div>`;
                    botMsgElem.innerHTML = imgHtml + `
                        <div class="bot-actions">
                            <a class="bot-action-btn" href="${data.imageUrl}" download="imagen4.jpg">📥 Download</a>
                            <button class="bot-action-btn" onclick="copyText(this)">📋 Copy Prompt</button>
                        </div>`;
                    
                    chatSessions[currentSessionId].messages.push({ role: 'bot', text: `![Generated Image](${data.imageUrl})` });
                    saveSessions();
                    updateWordCounter(message);
                    scrollToBottom(false);
                    return;
                }

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, files: tempFiles, model, mode, customPrompt })
                });

                if (!response.ok) throw new Error('Server returned status ' + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullResponse += decoder.decode(value, { stream: true });
                    botMsgElem.innerHTML = `<div>${marked.parse(fullResponse)}</div>
                        <div class="bot-actions">
                            <button class="bot-action-btn" onclick="speakText(this)">🔊 Listen</button>
                            <button class="bot-action-btn" onclick="copyText(this)">📋 Copy</button>
                        </div>`;
                    
                    botMsgElem.querySelectorAll('img').forEach(img => {
                        img.onclick = () => openLightbox(img.src);
                    });
                    scrollToBottom(false);
                }

                chatSessions[currentSessionId].messages.push({ role: 'bot', text: fullResponse });
                saveSessions();
                document.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));

                updateWordCounter(message + ' ' + fullResponse);

                if (document.getElementById('autoTTSToggle').checked) {
                    speakRawText(fullResponse);
                }

            } catch (err) {
                botMsgElem.innerHTML = `
                    <div class="minimal-error-card">
                        <span class="minimal-error-text">⚠️ ${escapeHTML(err.message || 'Connection Error')}</span>
                        <button class="minimal-retry-btn" onclick="retryLastMessage(this)" title="Try Again">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.63-5.19"/>
                            </svg>
                        </button>
                    </div>
                `;
                scrollToBottom(true);
            }
        }

        function retryLastMessage(btn) {
            btn.classList.add('spinning');
            setTimeout(() => {
                if (currentSessionId && chatSessions[currentSessionId]) {
                    const messages = chatSessions[currentSessionId].messages;
                    let lastUserMsgIndex = -1;
                    for (let i = messages.length - 1; i >= 0; i--) {
                        if (messages[i].role === 'user') {
                            lastUserMsgIndex = i;
                            break;
                        }
                    }

                    if (lastUserMsgIndex !== -1) {
                        const lastMsg = messages[lastUserMsgIndex];
                        if (chatBox.lastChild) chatBox.removeChild(chatBox.lastChild);
                        document.getElementById('userInput').value = lastMsg.text || '';
                        
                        selectedFilesData = [];
                        if (lastMsg.files && lastMsg.files.length > 0) {
                            lastMsg.files.forEach(f => {
                                selectedFilesData.push({
                                    name: f.name,
                                    mimeType: f.mimeType,
                                    data: f.fullData ? f.fullData.split(',')[1] : '',
                                    fullData: f.fullData
                                });
                            });
                            renderFilePreviews();
                        }

                        chatSessions[currentSessionId].messages.splice(lastUserMsgIndex);
                        saveSessions();
                        sendMessage();
                    } else {
                        btn.classList.remove('spinning');
                    }
                } else {
                    btn.classList.remove('spinning');
                }
            }, 400);
        }

        function clearCurrentChat() {
            if (isBibleMode && currentBibleSessionId && bibleChatSessions[currentBibleSessionId]) {
                bibleChatSessions[currentBibleSessionId].messages = [];
                saveBibleSessions();
                renderBibleWelcomeScreen();
                return;
            }
            if (currentSessionId && chatSessions[currentSessionId]) {
                chatSessions[currentSessionId].messages = [];
                saveSessions();
                renderWelcomeScreen();
            }
        }

        function runCode(id) {
            const codeText = document.getElementById(id).innerText;
            const modal = document.getElementById('codePreviewModal');
            const iframe = document.getElementById('previewIframe');
            modal.classList.add('open');
            iframe.srcdoc = codeText;
        }

        function closeCodePreview() {
            const modal = document.getElementById('codePreviewModal');
            const iframe = document.getElementById('previewIframe');
            modal.classList.remove('open');
            iframe.srcdoc = '';
        }

        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('imageLightbox');
            document.getElementById('lightboxImg').src = imgSrc;
            lightbox.classList.add('open');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('imageLightbox');
            lightbox.classList.remove('open');
        }

        function copyCode(id, btn) {
            navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => {
                btn.innerText = '✓ Copied!';
                setTimeout(() => btn.innerText = '📋 Copy', 2000);
            });
        }

        function copyText(btn) {
            const text = btn.closest('.msg').querySelector('div').innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = '✓ Copied!';
                setTimeout(() => btn.innerText = '📋 Copy', 2000);
            });
        }

        function speakText(btn) {
            speakRawText(btn.closest('.msg').querySelector('div').innerText);
        }

        function speakRawText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[*_#`~>\[\]\(\)]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            systemVoices = window.speechSynthesis.getVoices();
            const tagalogWords = /\b(ang|mga|na|ay|at|sa|ko|mo|niya|kami|tayo|sila|ito|iyan|iyon|ba|ka|din|rin|nang|para|kay|kung|pero|syempre|gawin|ano|sino|saan|paano|diyos|panginoon)\b/i;
            const isTagalog = tagalogWords.test(cleanText);
            
            let targetVoice = null;
            if (isTagalog && systemVoices.length > 0) {
                targetVoice = systemVoices.find(v => {
                    const lang = (v.lang || '').toLowerCase();
                    const name = (v.name || '').toLowerCase();
                    return lang === 'fil-ph' || lang === 'tl-ph' || name.includes('filipino') || name.includes('tagalog');
                });
            }
            if (!targetVoice && systemVoices.length > 0) {
                targetVoice = systemVoices.find(v => {
                    const lang = (v.lang || '').toLowerCase();
                    return lang === 'en-us' || lang === 'en-gb' || lang.startsWith('en');
                });
            }
            
            if (targetVoice) {
                utterance.voice = targetVoice;
                utterance.lang = targetVoice.lang;
            } else {
                utterance.lang = isTagalog ? 'tl-PH' : 'en-US';
            }
            
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function toggleSpeechRecognition() {
            const userInput = document.getElementById('userInput');
            const waveContainer = document.getElementById('waveContainer');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showAlert('Speech recognition is not supported in this browser.', 'Browser Restriction', '⚠️');
                return;
            }
            if (isRecording) {
                if (recognition) recognition.stop();
                stopRecordingUI();
            } else {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'fil-PH';
                recognition.onstart = () => {
                    isRecording = true;
                    userInput.style.display = 'none';
                    waveContainer.classList.add('active');
                };
                recognition.onresult = (event) => {
                    userInput.value = event.results[0][0].transcript;
                    stopRecordingUI();
                };
                recognition.onerror = () => stopRecordingUI();
                recognition.onend = () => stopRecordingUI();
                recognition.start();
            }
        }

        function stopRecordingUI() {
            isRecording = false;
            document.getElementById('userInput').style.display = 'block';
            document.getElementById('waveContainer').classList.remove('active');
        }

        async function checkPing() {
            const pingText = document.getElementById('pingText');
            const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
            const start = performance.now();
            try {
                await fetch('/api/chat', { method: 'HEAD', cache: 'no-store' });
                pingText.innerText = Math.round(performance.now() - start) + ' ms';
                bars.forEach(bar => bar.style.backgroundColor = 'var(--sig-good)');
            } catch (e) {
                pingText.innerText = 'Offline';
                bars.forEach(bar => bar.style.backgroundColor = 'var(--sig-bad)');
            }
        }

        setInterval(checkPing, 5000);
        checkPing();

        function escapeHTML(s) { 
            return s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t)); 
        }

        if (Object.keys(chatSessions).length > 0) {
            loadChatSession(Object.keys(chatSessions)[Object.keys(chatSessions).length - 1]);
        } else {
            createNewChat();
        }
    </script>
