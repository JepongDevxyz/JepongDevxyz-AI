<!DOCTYPE html>
<html lang="en">
<!-- Jay-Ar Lee Espiritu -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <title>JepongDevxyz AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(21, 29, 45, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --user-msg: rgba(30, 41, 59, 0.9);
            --bot-msg: transparent;
            --sig-good: #10b981;
            --sig-bad: #ef4444;
        }

        body.theme-neon {
          --bg-color: #050505;
          --card-bg: rgba(20, 20, 20, 0.8);
          --accent-color: #00ffcc;
          --text-main: #00ffcc;
          --text-muted: #00b399;
        }

        body.theme-sunset {
          --bg-color: #1a0b2e;
          --card-bg: rgba(45, 15, 64, 0.7);
          --accent-color: #ff5e62;
          --text-main: #ffecd2;
          --text-muted: #d8b4fe;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); transition: background 0.3s ease; }

        .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card-bg); backdrop-filter: blur(20px); position: relative; }
        @media (min-width: 768px) {
            body { padding: 20px; display: flex; justify-content: center; align-items: center; }
            .app-container { max-width: 900px; height: 90vh; border: 1px solid var(--border-color); border-radius: 24px; }
        }

        .header { 
            padding: 10px 14px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            background: rgba(11, 15, 25, 0.95); 
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 10;
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        
        .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex-shrink: 1; padding: 2px 0; }
        .brand-icon { width: 34px; height: 34px; background: var(--accent-gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; cursor: pointer; border: none; }
        .brand-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }

        .header-tools-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .network-status { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.03); padding: 4px 8px; border-radius: 8px; font-size: 0.7rem; color: var(--text-muted); }

        .signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
        .bar { width: 2.5px; background-color: var(--sig-good); border-radius: 1px; transition: background-color 0.3s ease; }
        .bar-1 { height: 25%; } .bar-2 { height: 50%; } .bar-3 { height: 75%; } .bar-4 { height: 100%; }

        .header-controls { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; align-items: center; }
        .custom-prompt-input { flex: 1; background: rgba(30, 41, 59, 0.5); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; min-width: 100%; display: none; margin-top: 4px; }
        
        .header-btn { background: transparent; color: var(--text-main); border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.72rem; flex-shrink: 0; transition: background 0.2s; }
        .header-btn:hover { background: rgba(255, 255, 255, 0.05); }
        .clear-btn { color: #fca5a5; }
        .clear-btn:hover { background: rgba(239, 68, 68, 0.1); }

        .selector-wrapper { position: relative; flex: 1; min-width: 140px; }
        .dropdown-btn { width: 100%; background: rgba(30, 41, 59, 0.5); color: var(--text-main); border: 1px solid var(--border-color); padding: 7px 10px; border-radius: 8px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; }
        .modal-overlay.open { display: flex; align-items: center; justify-content: center; }
        
        #customAlertOverlay { z-index: 3500; }
        
        .floating-modal { background: #151d2d; border: 1px solid var(--border-color); border-radius: 20px; width: 90%; max-width: 340px; padding: 10px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: modalPop 0.2s ease-out; max-height: 85vh; overflow-y: auto; }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .custom-alert-card {
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            width: 90%;
            max-width: 340px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .alert-header { display: flex; align-items: center; gap: 10px; }
        .alert-icon { width: 36px; height: 36px; border-radius: 10px; background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .alert-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
        .alert-body { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; word-break: break-word; }
        .alert-footer { display: flex; justify-content: flex-end; margin-top: 4px; }
        .alert-btn { background: var(--accent-gradient); color: #ffffff; border: none; padding: 8px 18px; border-radius: 10px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }

        .option-item { background: transparent; border: none; border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; color: var(--text-main); width: 100%; }
        .option-item:hover { background: rgba(255, 255, 255, 0.05); }
        .option-item.active { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); }
        
        .option-info { display: flex; flex-direction: column; gap: 2px; }
        .option-name { font-weight: 600; font-size: 0.88rem; }
        .option-desc { font-size: 0.72rem; color: var(--text-muted); }
        
        .radio-icon { width: 18px; height: 18px; border: 2px solid var(--text-muted); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .option-item.active .radio-icon { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.2); box-shadow: inset 0 0 0 3px #8b5cf6; }
        
        .divider { height: 1px; background: var(--border-color); margin: 6px 0; }

        .sidebar-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 900; }
        .sidebar { position: absolute; top: 0; left: -280px; width: 280px; height: 100%; background: #0f172a; border-right: 1px solid var(--border-color); z-index: 901; transition: left 0.3s ease; display: flex; flex-direction: column; padding: 16px; gap: 14px; }
        .sidebar.open { left: 0; }
        .sidebar-overlay.open { display: block; }
        
        .sidebar-header { position: relative; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .sidebar-header h3 { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
        .close-sidebar-btn { position: absolute; right: 0; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }
        
        .new-chat-btn { background: var(--accent-gradient); color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .search-chat-input { background: rgba(30, 41, 59, 0.5); border: none; color: var(--text-main); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; width: 100%; }
        .chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        
        .history-item { background: transparent; border: none; border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; color: var(--text-main); }
        .history-item:hover { background: rgba(255, 255, 255, 0.03); }
        .history-item.active { background: rgba(99, 102, 241, 0.15); }
        .history-item-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
        .delete-hist-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; }
        .delete-hist-btn:hover { color: #ef4444; }

        .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }
        
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; margin: auto; width: 100%; }
        .welcome-title { font-size: 1.85rem; font-weight: 700; background: linear-gradient(90deg, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .msg { max-width: 100%; font-size: 0.92rem; line-height: 1.6; word-break: break-word; position: relative; }
        .msg.user.has-bubble { padding: 12px 16px; border-radius: 16px; background: var(--user-msg); border: 1px solid var(--border-color); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; max-width: 88%; }
        .msg.user.no-bubble { align-self: flex-end; background: transparent; border: none; padding: 0; }

        .msg.bot { align-self: flex-start; background: var(--bot-msg); border: none; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 8px; }
        .msg.bot p { margin-bottom: 8px; }
        .msg.bot ul, .msg.bot ol { padding-left: 20px; margin-bottom: 8px; }
        .msg.bot li { margin-bottom: 6px; }
        
        .msg img { max-width: 100%; max-height: 300px; border-radius: 12px; border: 1px solid var(--border-color); object-fit: cover; cursor: pointer; }

        .bot-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
        .bot-action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; text-decoration: none; }
        .bot-action-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

        .code-block-wrapper { background: #131722; border: 1px solid var(--border-color); border-radius: 10px; margin: 8px 0; overflow: hidden; }
        .code-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 6px 12px; font-size: 0.75rem; color: var(--text-muted); }
        .code-actions { display: flex; gap: 6px; }
        .code-actions button { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
        pre { padding: 12px; overflow-x: auto; font-size: 0.85rem; }

        .input-container { padding: 12px 16px 18px 16px; background: transparent; }
        .chat-input-pill {
            background: #1f222a;
            border-radius: 40px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .pill-plus-btn { background: transparent; border: none; color: #e2e8f0; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
        .pill-input { flex: 1; background: transparent; border: none; color: #ffffff !important; font-size: 0.95rem; caret-color: #3b82f6; padding: 4px 6px; min-width: 0; }
        .pill-input::placeholder { color: #94a3b8; }

        .pill-action-btn { background: #8b5cf6; color: #ffffff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        #scrollBtn { display: none; position: absolute; bottom: 85px; right: 20px; background: var(--accent-gradient); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; z-index: 10; }

        .image-lightbox-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 3000; justify-content: center; align-items: center; padding: 20px; }
        .image-lightbox-overlay.open { display: flex; }
        .image-lightbox-content { max-width: 100%; max-height: 90vh; border-radius: 12px; object-fit: contain; }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>💬 Chat History</h3>
                <button class="close-sidebar-btn" onclick="toggleSidebar(false)">✕</button>
            </div>
            <button class="new-chat-btn" onclick="createNewChat()"><span>➕</span> New Chat</button>
            <input type="text" class="search-chat-input" id="searchChatInput" placeholder="🔍 Search chat..." oninput="filterChatHistory()">
            <div class="chat-history-list" id="chatHistoryList"></div>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <div class="brand">
                    <button class="brand-icon" onclick="toggleSidebar(true)">✦</button>
                    <div class="brand-title" id="brandTitleText">JepongDevxyz AI</div>
                </div>
                <div class="header-tools-group">
                    <div class="network-status">
                        <span id="pingText">Checking...</span>
                    </div>
                    <button class="header-btn clear-btn" onclick="clearCurrentChat()">Clear</button>
                </div>
            </div>

            <div class="header-controls">
                <div class="selector-wrapper">
                    <button class="dropdown-btn" onclick="toggleModal('modeModalOverlay', true)">
                        <span id="selectedModeText">🤖 General AI</span>
                        <span>▼</span>
                    </button>
                </div>

                <div class="selector-wrapper">
                    <button class="dropdown-btn" onclick="toggleModal('modelModalOverlay', true)">
                        <span id="selectedModelText">2.5 Flash</span>
                        <span>▼</span>
                    </button>
                </div>
                
                <input type="text" id="customPromptInput" class="custom-prompt-input" placeholder="Type custom persona instructions here...">
            </div>
        </div>

        <!-- Mode Modal -->
        <div class="modal-overlay" id="modeModalOverlay" onclick="if(event.target === this) toggleModal('modeModalOverlay', false)">
            <div class="floating-modal">
                <button class="option-item active" onclick="selectMode('general', '🤖 General AI')">
                    <div class="option-info"><span class="option-name">🤖 General AI</span></div>
                </button>
                <button class="option-item" onclick="selectMode('school', '🎓 School Purpose')">
                    <div class="option-info"><span class="option-name">🎓 School Purpose</span></div>
                </button>
                <button class="option-item" onclick="selectMode('coder', '💻 Expert Coder')">
                    <div class="option-info"><span class="option-name">💻 Expert Coder</span></div>
                </button>
                <button class="option-item" onclick="selectMode('tagalog', '🇵🇭 Tagalog Friend')">
                    <div class="option-info"><span class="option-name">🇵🇭 Tagalog Friend</span></div>
                </button>
                <button class="option-item" onclick="selectMode('imagen', '🎨 Image Generator')">
                    <div class="option-info"><span class="option-name">🎨 Image Generator</span></div>
                </button>
                <button class="option-item" onclick="selectMode('custom', '✏️ Custom Persona')">
                    <div class="option-info"><span class="option-name">✏️ Custom Persona</span></div>
                </button>
            </div>
        </div>

        <!-- Model Modal -->
        <div class="modal-overlay" id="modelModalOverlay" onclick="if(event.target === this) toggleModal('modelModalOverlay', false)">
            <div class="floating-modal">
                <button class="option-item" onclick="selectModel('gemini-2.5-flash-lite', '2.5 Flash-Lite')">
                    <div class="option-info"><div class="option-name">2.5 Flash-Lite</div><div class="option-desc">Fastest answers</div></div>
                </button>
                <button class="option-item active" onclick="selectModel('gemini-2.5-flash', '2.5 Flash')">
                    <div class="option-info"><div class="option-name">2.5 Flash</div><div class="option-desc">All-around help</div></div>
                </button>
                <button class="option-item" onclick="selectModel('gemini-2.5-pro', '2.5 Pro')">
                    <div class="option-info"><div class="option-name">2.5 Pro</div><div class="option-desc">Advanced reasoning</div></div>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-box" id="chatBox">
            <button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>
        </div>

        <!-- Input Box -->
        <div class="input-container">
            <div class="chat-input-pill">
                <input type="text" class="pill-input" id="userInput" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter') sendMessage()">
                
                <button class="pill-action-btn" onclick="sendMessage()" title="Send">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div class="image-lightbox-overlay" id="imageLightbox" onclick="closeLightbox()">
        <img class="image-lightbox-content" id="lightboxImg" alt="Enlarged view">
    </div>

    <script>
        let chatSessions = JSON.parse(localStorage.getItem('jepong_ai_chats') || '{}');
        let currentSessionId = null;
        let currentSelectedModel = 'gemini-2.5-flash';
        let currentSelectedMode = 'general';

        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            const codeContent = typeof code === 'object' ? code.text : code;
            const lang = language || 'code';
            const blockId = 'code-' + Math.random().toString(36).substring(2, 9);
            return `
                <div class="code-block-wrapper">
                    <div class="code-header">
                        <span>${lang}</span>
                        <div class="code-actions">
                            <button onclick="copyCode('${blockId}', this)">📋 Copy</button>
                        </div>
                    </div>
                    <pre><code id="${blockId}" class="language-${lang}">${escapeHTML(codeContent)}</code></pre>
                </div>
            `;
        };
        marked.use({ renderer });

        const chatBox = document.getElementById('chatBox');

        function saveSessions() {
            localStorage.setItem('jepong_ai_chats', JSON.stringify(chatSessions));
            renderSidebarHistory();
        }

        function scrollToBottom(forced = false) {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function toggleModal(modalId, show) {
            document.getElementById(modalId).classList.toggle('open', show);
        }

        function selectMode(modeKey, modeDisplayName) {
            currentSelectedMode = modeKey;
            document.getElementById('selectedModeText').innerText = modeDisplayName;
            toggleModal('modeModalOverlay', false);
            document.getElementById('customPromptInput').style.display = modeKey === 'custom' ? 'block' : 'none';
        }

        function selectModel(modelKey, modelDisplayName) {
            currentSelectedModel = modelKey;
            document.getElementById('selectedModelText').innerText = modelDisplayName;
            toggleModal('modelModalOverlay', false);
        }

        function renderWelcomeScreen() {
            chatBox.innerHTML = `
                <div class="welcome-screen">
                    <div class="welcome-title">JepongDevxyz AI</div>
                </div>
                <button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>
            `;
        }

        function toggleSidebar(show) {
            document.getElementById('sidebar').classList.toggle('open', show);
            document.getElementById('sidebarOverlay').classList.toggle('open', show);
            if (show) renderSidebarHistory();
        }

        function createNewChat() {
            currentSessionId = 'session_' + Date.now();
            chatSessions[currentSessionId] = { id: currentSessionId, title: 'New Conversation', messages: [] };
            saveSessions();
            renderWelcomeScreen();
            toggleSidebar(false);
        }

        function loadChatSession(id) {
            currentSessionId = id;
            const session = chatSessions[id];
            if (!session) return;

            if (session.messages.length === 0) {
                renderWelcomeScreen();
            } else {
                chatBox.innerHTML = '<button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>';
                session.messages.forEach(msg => {
                    if (msg.role === 'user') {
                        chatBox.innerHTML += `<div class="msg user has-bubble"><div>${escapeHTML(msg.text)}</div></div>`;
                    } else {
                        const botDiv = document.createElement('div');
                        botDiv.className = 'msg bot';
                        botDiv.innerHTML = `<div>${marked.parse(msg.text)}</div>`;
                        chatBox.appendChild(botDiv);
                    }
                });
            }
            scrollToBottom(true);
            toggleSidebar(false);
        }

        function renderSidebarHistory(filter = '') {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = '';
            Object.values(chatSessions).reverse().forEach(session => {
                if (filter && !session.title.toLowerCase().includes(filter.toLowerCase())) return;
                const item = document.createElement('div');
                item.className = 'history-item' + (session.id === currentSessionId ? ' active' : '');
                item.onclick = () => loadChatSession(session.id);
                item.innerHTML = `<span class="history-item-text">${escapeHTML(session.title)}</span>`;
                list.appendChild(item);
            });
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            if (!currentSessionId || !chatSessions[currentSessionId]) createNewChat();

            if (chatSessions[currentSessionId].messages.length === 0) {
                chatBox.innerHTML = '<button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>';
                chatSessions[currentSessionId].title = message.substring(0, 25);
            }

            chatBox.innerHTML += `<div class="msg user has-bubble"><div>${escapeHTML(message)}</div></div>`;
            chatSessions[currentSessionId].messages.push({ role: 'user', text: message });
            saveSessions();

            input.value = '';

            const botMsgElem = document.createElement('div');
            botMsgElem.className = 'msg bot';
            botMsgElem.innerText = currentSelectedMode === 'imagen' ? 'Lilikha ng Larawan...' : 'Nag-iisip...';
            chatBox.appendChild(botMsgElem);
            scrollToBottom(true);

            const customPrompt = document.getElementById('customPromptInput').value;

            try {
                // TAWAG SA /api/chat ENDPOINT (Streaming Text + Image Generation)
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message, 
                        model: currentSelectedModel, 
                        mode: currentSelectedMode, 
                        customPrompt: customPrompt 
                    })
                });

                if (!response.ok) throw new Error('Server returned status ' + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullResponse += decoder.decode(value, { stream: true });
                    botMsgElem.innerHTML = `<div>${marked.parse(fullResponse)}</div>`;
                    
                    botMsgElem.querySelectorAll('img').forEach(img => {
                        img.onclick = () => openLightbox(img.src);
                    });
                    scrollToBottom(false);
                }

                chatSessions[currentSessionId].messages.push({ role: 'bot', text: fullResponse });
                saveSessions();

            } catch (err) {
                botMsgElem.innerHTML = `<div style="color: #ef4444;">⚠️ Error: ${escapeHTML(err.message)}</div>`;
            }
        }

        function clearCurrentChat() {
            if (currentSessionId && chatSessions[currentSessionId]) {
                chatSessions[currentSessionId].messages = [];
                saveSessions();
                renderWelcomeScreen();
            }
        }

        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('imageLightbox');
            document.getElementById('lightboxImg').src = imgSrc;
            lightbox.classList.add('open');
        }

        function closeLightbox() {
            document.getElementById('imageLightbox').classList.remove('open');
        }

        function copyCode(id, btn) {
            navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => {
                btn.innerText = '✓ Copied!';
                setTimeout(() => btn.innerText = '📋 Copy', 2000);
            });
        }

        function escapeHTML(s) { 
            return s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t)); 
        }

        if (Object.keys(chatSessions).length > 0) {
            loadChatSession(Object.keys(chatSessions)[Object.keys(chatSessions).length - 1]);
        } else {
            createNewChat();
        }
    </script>
</body>
</html>
