<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JepongDevxyz AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(21, 29, 45, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            /* Pinalitan na natin ang user-msg para maging clean dark slate theme */
            --user-msg: rgba(30, 41, 59, 0.9);
            --bot-msg: rgba(30, 41, 59, 0.7);
            --sig-good: #10b981;
            --sig-bad: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); }

        .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card-bg); backdrop-filter: blur(20px); position: relative; }
        @media (min-width: 768px) {
            body { padding: 20px; display: flex; justify-content: center; align-items: center; }
            .app-container { max-width: 900px; height: 90vh; border: 1px solid var(--border-color); border-radius: 24px; }
        }

        .header { 
            padding: 10px 14px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            background: rgba(11, 15, 25, 0.95); 
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 10;
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        
        .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex-shrink: 1; padding: 2px 0; }
        .brand-icon { width: 34px; height: 34px; background: var(--accent-gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; cursor: pointer; border: none; }
        .brand-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }

        .header-tools-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .network-status { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.03); padding: 4px 8px; border-radius: 8px; font-size: 0.7rem; color: var(--text-muted); }

        .signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
        .bar { width: 2.5px; background-color: var(--sig-good); border-radius: 1px; transition: background-color 0.3s ease; }
        .bar-1 { height: 25%; } .bar-2 { height: 50%; } .bar-3 { height: 75%; } .bar-4 { height: 100%; }

        .header-controls { display: flex; gap: 6px; width: 100%; flex-wrap: wrap; align-items: center; }
        .custom-prompt-input { flex: 1; background: rgba(30, 41, 59, 0.5); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; min-width: 100%; display: none; margin-top: 4px; }
        
        .header-btn { background: transparent; color: var(--text-main); border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.72rem; flex-shrink: 0; transition: background 0.2s; }
        .header-btn:hover { background: rgba(255, 255, 255, 0.05); }
        .clear-btn { color: #fca5a5; }
        .clear-btn:hover { background: rgba(239, 68, 68, 0.1); }

        .selector-wrapper { position: relative; flex: 1; min-width: 130px; }
        .dropdown-btn { width: 100%; background: rgba(30, 41, 59, 0.5); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 1000; }
        .modal-overlay.open { display: flex; align-items: center; justify-content: center; }
        
        .floating-modal { background: #151d2d; border: 1px solid var(--border-color); border-radius: 20px; width: 90%; max-width: 340px; padding: 10px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: modalPop 0.2s ease-out; max-height: 85vh; overflow-y: auto; }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .option-item { background: transparent; border: none; border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; color: var(--text-main); width: 100%; }
        .option-item:hover { background: rgba(255, 255, 255, 0.05); }
        .option-item.active { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); }
        
        .option-info { display: flex; flex-direction: column; gap: 2px; }
        .option-name { font-weight: 600; font-size: 0.88rem; }
        .option-desc { font-size: 0.72rem; color: var(--text-muted); }
        
        .radio-icon { width: 18px; height: 18px; border: 2px solid var(--text-muted); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
        .option-item.active .radio-icon { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.2); box-shadow: inset 0 0 0 3px #8b5cf6; }
        
        .divider { height: 1px; background: var(--border-color); margin: 6px 0; }

        .sidebar-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 900; }
        .sidebar { position: absolute; top: 0; left: -280px; width: 280px; height: 100%; background: #0f172a; border-right: 1px solid var(--border-color); z-index: 901; transition: left 0.3s ease; display: flex; flex-direction: column; padding: 16px; gap: 14px; }
        .sidebar.open { left: 0; }
        .sidebar-overlay.open { display: block; }
        
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .sidebar-header h2 { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
        .close-sidebar-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }
        
        .new-chat-btn { background: var(--accent-gradient); color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .sidebar-settings { background: rgba(255, 255, 255, 0.02); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; color: var(--text-main); }
        .tts-toggle-wrapper { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .tts-toggle-wrapper input { cursor: pointer; width: 16px; height: 16px; accent-color: #8b5cf6; }

        .search-chat-input { background: rgba(30, 41, 59, 0.5); border: none; color: var(--text-main); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; width: 100%; }
        .chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        
        .history-item { background: transparent; border: none; border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; transition: background 0.2s; color: var(--text-main); }
        .history-item:hover { background: rgba(255, 255, 255, 0.03); }
        .history-item.active { background: rgba(99, 102, 241, 0.15); }
        .history-item-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
        .delete-hist-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; }
        .delete-hist-btn:hover { color: #ef4444; }

        .chat-box { 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            position: relative; 
            z-index: 1;
        }
        
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; margin: auto; width: 100%; }
        .welcome-lottie-top { width: 220px; height: 60px; margin-bottom: -10px; }
        .welcome-title { font-size: 1.85rem; font-weight: 700; background: linear-gradient(90deg, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; margin: 0; line-height: 1; }
        .welcome-lottie-bottom { width: 100%; max-width: 260px; height: auto; aspect-ratio: 16 / 9; margin-top: -55px; }

        .msg { max-width: 88%; padding: 12px 16px; border-radius: 16px; font-size: 0.92rem; line-height: 1.5; word-break: break-word; position: relative; }
        .user { align-self: flex-end; background: var(--user-msg); border: 1px solid var(--border-color); color: #fff; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: var(--bot-msg); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; display: flex; flex-direction: column; gap: 8px; }
        
        /* Ginawa nating clickable/interactive ang mga larawan sa chat */
        .msg img { max-width: 100%; max-height: 250px; border-radius: 12px; margin-top: 8px; border: 1px solid var(--border-color); object-fit: cover; cursor: pointer; transition: transform 0.2s; display: block; }
        .msg img:hover { transform: scale(1.02); opacity: 0.95; }

        .bot-actions { display: flex; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.05); flex-wrap: wrap; }
        .bot-action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; text-decoration: none; }
        .bot-action-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

        .code-block-wrapper { background: #131722; border: 1px solid var(--border-color); border-radius: 10px; margin: 8px 0; overflow: hidden; }
        .code-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 6px 12px; font-size: 0.75rem; color: var(--text-muted); }
        .code-actions { display: flex; gap: 6px; }
        .code-actions button { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
        .code-actions button:hover { background: rgba(255, 255, 255, 0.2); }
        pre { padding: 12px; overflow-x: auto; font-size: 0.85rem; }

        .input-container { padding: 12px 16px 18px 16px; background: transparent; }
        .chat-input-pill {
            background: #1f222a;
            border-radius: 40px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .pill-plus-btn { background: transparent; border: none; color: #e2e8f0; font-size: 1.4rem; font-weight: 300; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
        .pill-input { flex: 1; background: transparent; border: none; color: #ffffff !important; font-size: 0.95rem; caret-color: #3b82f6; padding: 4px 6px; min-width: 0; }
        .pill-input::placeholder { color: #94a3b8; font-weight: 400; }

        .wave-container { display: none; flex: 1; align-items: center; justify-content: center; gap: 4px; height: 32px; padding: 0 8px; }
        .wave-container.active { display: flex; }
        .wave-bar { width: 3px; background: #e2e8f0; border-radius: 2px; animation: waveAnim 1.2s infinite ease-in-out; }
        .wave-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 20px; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 28px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 16px; animation-delay: 0.4s; }
        .wave-bar:nth-child(5) { height: 24px; animation-delay: 0.15s; }
        .wave-bar:nth-child(6) { height: 12px; animation-delay: 0.35s; }
        .wave-bar:nth-child(7) { height: 22px; animation-delay: 0.25s; }

        @keyframes waveAnim {
            0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
            50% { transform: scaleY(1.2); opacity: 1; background: #8b5cf6; }
        }

        .pill-mic-btn { background: transparent; border: none; color: #e2e8f0; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; transition: background 0.2s; }
        .pill-mic-btn:hover { background: rgba(255,255,255,0.08); }
        
        .pill-action-btn { background: #8b5cf6; color: #ffffff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.2s ease, background-color 0.2s ease; }
        .pill-action-btn:hover { background: #7c3aed; transform: scale(1.05); }

        .file-preview-row { display: none; gap: 8px; overflow-x: auto; padding: 4px 2px 10px 2px; }
        .gemini-chip { position: relative; display: inline-flex; align-items: center; background: rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 4px 8px; height: 48px; color: var(--text-main); }
        .gemini-chip.img-chip { padding: 0; width: 52px; height: 52px; border-radius: 12px; overflow: hidden; }
        .gemini-chip img { width: 100%; height: 100%; object-fit: cover; }
        .chip-close-btn { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; background: rgba(0, 0, 0, 0.75); border: none; color: #ffffff; border-radius: 50%; font-size: 0.65rem; cursor: pointer; }

        #scrollBtn { display: none; position: absolute; bottom: 85px; right: 20px; background: var(--accent-gradient); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; z-index: 10; }

        .preview-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .preview-modal-overlay.open {
            display: flex;
        }
        .preview-modal-content {
            background: #0f172a;
            border: 1px solid var(--border-color);
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 95vh;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: modalPop 0.2s ease-out;
        }
        .preview-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.7);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .preview-close-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .preview-close-btn:hover {
            background: rgba(239, 68, 68, 0.4);
        }
        .preview-iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #000;
        }

        /* Modal para sa pag-zoom ng image kapag pinindot */
        .image-lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .image-lightbox-overlay.open {
            display: flex;
        }
        .image-lightbox-content {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
            object-fit: contain;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>💬 Chat History - JepongDevxyz AI</h2>
                <button class="close-sidebar-btn" onclick="toggleSidebar(false)">✕</button>
            </div>
            <button class="new-chat-btn" onclick="createNewChat()"><span>➕</span> New Chat</button>
            
            <div class="sidebar-settings">
                <span>🔊 AI Speech</span>
                <label class="tts-toggle-wrapper">
                    <input type="checkbox" id="autoTTSToggle">
                </label>
            </div>

            <input type="text" class="search-chat-input" id="searchChatInput" placeholder="🔍 Search chat..." oninput="filterChatHistory()">
            <div class="chat-history-list" id="chatHistoryList"></div>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <div class="brand">
                    <button class="brand-icon" onclick="toggleSidebar(true)">✦</button>
                    <div class="brand-title">JepongDevxyz AI</div>
                </div>
                <div class="header-tools-group">
                    <div class="network-status" id="networkStatus">
                        <div class="signal-bars">
                            <div class="bar bar-1" id="bar1"></div>
                            <div class="bar bar-2" id="bar2"></div>
                            <div class="bar bar-3" id="bar3"></div>
                            <div class="bar bar-4" id="bar4"></div>
                        </div>
                        <span id="pingText">Checking...</span>
                    </div>
                    <button class="header-btn clear-btn" onclick="clearCurrentChat()">Clear</button>
                </div>
            </div>

            <div class="header-controls">
                <div class="selector-wrapper">
                    <button class="dropdown-btn" onclick="toggleModal('modeModalOverlay', true)">
                        <span id="selectedModeText">🤖 Mode: General AI</span>
                        <span>▼</span>
                    </button>
                </div>

                <div class="selector-wrapper">
                    <button class="dropdown-btn" onclick="toggleModal('modelModalOverlay', true)">
                        <span id="selectedModelText">3.6 Flash</span>
                        <span>▼</span>
                    </button>
                </div>
                
                <input type="text" id="customPromptInput" class="custom-prompt-input" placeholder="Type custom persona instructions here...">
            </div>
        </div>

        <!-- Mode Modal Overlay -->
        <div class="modal-overlay" id="modeModalOverlay" onclick="if(event.target === this) toggleModal('modeModalOverlay', false)">
            <div class="floating-modal">
                <button class="option-item active" onclick="selectMode('general', '🤖 Mode: General AI')">
                    <div class="option-info"><span class="option-name">🤖 Mode: General AI</span></div>
                    <div class="radio-icon"></div>
                </button>
                <button class="option-item" onclick="selectMode('school', '🎓 Mode: School Purpose')">
                    <div class="option-info"><span class="option-name">🎓 Mode: School Purpose</span></div>
                    <div class="radio-icon"></div>
                </button>
                <button class="option-item" onclick="selectMode('coder', '💻 Mode: Expert Coder')">
                    <div class="option-info"><span class="option-name">💻 Mode: Expert Coder</span></div>
                    <div class="radio-icon"></div>
                </button>
                <button class="option-item" onclick="selectMode('tagalog', '🇵🇭 Mode: Pure Tagalog Friend')">
                    <div class="option-info"><span class="option-name">🇵🇭 Mode: Pure Tagalog Friend</span></div>
                    <div class="radio-icon"></div>
                </button>
                <button class="option-item" onclick="selectMode('affiliate', '🛒 Mode: Affiliate Marketer')">
                    <div class="option-info"><span class="option-name">🛒 Mode: Affiliate Marketer</span></div>
                    <div class="radio-icon"></div>
                </button>
                <button class="option-item" onclick="selectMode('custom', '✏️ Mode: Custom Persona')">
                    <div class="option-info"><span class="option-name">✏️ Mode: Custom Persona</span></div>
                    <div class="radio-icon"></div>
                </button>
            </div>
        </div>

        <!-- Model Modal Overlay -->
        <div class="modal-overlay" id="modelModalOverlay" onclick="if(event.target === this) toggleModal('modelModalOverlay', false)">
            <div class="floating-modal">
                <button class="option-item" onclick="selectModel('gemini-3.5-flash-lite', '3.5 Flash-Lite')">
                    <div class="option-info">
                        <div class="option-name">3.5 Flash-Lite</div>
                        <div class="option-desc">Fastest answers</div>
                    </div>
                    <div class="radio-icon"></div>
                </button>
                <button class="option-item active" onclick="selectModel('gemini-3.6-flash', 'Gemini 3.6 Flash')">
                    <div class="option-info">
                        <div class="option-name">Gemini 3.6 Flash</div>
                        <div class="option-desc">All-around help</div>
                    </div>
                    <div class="radio-icon"></div>
                </button>
                <button class="option-item" onclick="selectModel('gemini-3.1-pro', '3.1 Pro')">
                    <div class="option-info">
                        <div class="option-name">3.1 Pro</div>
                        <div class="option-desc">Advanced reasoning</div>
                    </div>
                    <div class="radio-icon"></div>
                </button>
                <div class="divider"></div>
                <button class="option-item" onclick="selectModel('gemini-3.7-extended-thinking', 'Extended thinking')">
                    <div class="option-info">
                        <div class="option-name">Extended thinking</div>
                        <div class="option-desc">Complex problem solving</div>
                    </div>
                    <div class="radio-icon"></div>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-box" id="chatBox">
            <button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>
        </div>

        <!-- Input Box -->
        <div class="input-container">
            <div class="file-preview-row" id="filePreviewContainer"></div>

            <div class="chat-input-pill">
                <input type="file" id="fileInput" hidden multiple onchange="handleFileSelect(event)">
                <button class="pill-plus-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">+</button>
                
                <input type="text" class="pill-input" id="userInput" placeholder="Ask JepongDevxyz AI..." onkeydown="if(event.key==='Enter') sendMessage()">
                
                <div class="wave-container" id="waveContainer">
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                </div>

                <button class="pill-mic-btn" id="micBtn" onclick="toggleSpeechRecognition()" title="Voice input">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2" width="6" height="12" rx="3" ry="3"></rect>
                        <path d="M5 10v2a7 7 0 0 0 14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                    </svg>
                </button>
                
                <button class="pill-action-btn" onclick="sendMessage()" title="Send">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- In-App Code Preview Modal -->
    <div class="preview-modal-overlay" id="codePreviewModal" onclick="if(event.target === this) closeCodePreview()">
        <div class="preview-modal-content">
            <div class="preview-modal-header">
                <span>Live Web Preview</span>
                <button class="preview-close-btn" onclick="closeCodePreview()">✕ Close</button>
            </div>
            <iframe class="preview-iframe" id="previewIframe"></iframe>
        </div>
    </div>

    <!-- Image Zoom Lightbox Modal -->
    <div class="image-lightbox-overlay" id="imageLightbox" onclick="closeLightbox()">
        <img class="image-lightbox-content" id="lightboxImg">
    </div>

    <script>
        let selectedFilesData = [];
        let chatSessions = JSON.parse(localStorage.getItem('jepong_ai_chats') || '{}');
        let currentSessionId = null;
        let currentSelectedModel = 'gemini-3.6-flash';
        let currentSelectedMode = 'general';
        let isRecording = false;
        let recognition = null;
        let userScrolledUp = false;
        let systemVoices = [];

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            systemVoices = window.speechSynthesis.getVoices();
        }

        loadVoices();
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            const codeContent = typeof code === 'object' ? code.text : code;
            const lang = language || 'code';
            const blockId = 'code-' + Math.random().toString(36).substring(2, 9);
            return `
                <div class="code-block-wrapper">
                    <div class="code-header">
                        <span>${lang}</span>
                        <div class="code-actions">
                            <button onclick="runCode('${blockId}')">▶ Run</button>
                            <button onclick="copyCode('${blockId}', this)">📋 Copy</button>
                        </div>
                    </div>
                    <pre><code id="${blockId}" class="language-${lang}">${escapeHTML(codeContent)}</code></pre>
                </div>
            `;
        };
        marked.use({ renderer });

        const chatBox = document.getElementById('chatBox');

        function saveSessions() {
            localStorage.setItem('jepong_ai_chats', JSON.stringify(chatSessions));
            renderSidebarHistory();
        }

        chatBox.addEventListener('scroll', () => {
            const scrollBtn = document.getElementById('scrollBtn');
            const isNearBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 100;
            
            if (scrollBtn) {
                scrollBtn.style.display = !isNearBottom ? 'block' : 'none';
            }

            userScrolledUp = !isNearBottom;
        });

        function scrollToBottom(forced = false) {
            if (forced || !userScrolledUp) {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function toggleModal(modalId, show) {
            document.getElementById(modalId).classList.toggle('open', show);
        }

        function selectMode(modeKey, modeDisplayName) {
            currentSelectedMode = modeKey;
            document.getElementById('selectedModeText').innerText = modeDisplayName;
            
            const modal = document.getElementById('modeModalOverlay');
            modal.querySelectorAll('.option-item').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(modeKey)) {
                    btn.classList.add('active');
                }
            });
            toggleModal('modeModalOverlay', false);
            document.getElementById('customPromptInput').style.display = modeKey === 'custom' ? 'block' : 'none';
        }

        function selectModel(modelKey, modelDisplayName) {
            currentSelectedModel = modelKey;
            document.getElementById('selectedModelText').innerText = modelDisplayName;
            
            const modal = document.getElementById('modelModalOverlay');
            modal.querySelectorAll('.option-item').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(modelKey)) {
                    btn.classList.add('active');
                }
            });
            toggleModal('modelModalOverlay', false);
        }

        function renderWelcomeScreen() {
            chatBox.innerHTML = `
                <div class="welcome-screen">
                    <lottie-player class="welcome-lottie-top" src="https://lottie.host/035962ae-ec85-4735-ac5b-3a3764108916/y2Kb1ZKXAi.json" background="transparent" speed="1" loop autoplay></lottie-player>
                    <div class="welcome-title">JepongDevxyz AI</div>
                    <lottie-player class="welcome-lottie-bottom" src="https://lottie.host/2477a7dc-71fb-4c1b-ab00-e006ead8ebe6/Ydd9GqGGLm.json" background="transparent" speed="1" loop autoplay></lottie-player>
                </div>
                <button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>
            `;
            userScrolledUp = false;
        }

        function toggleSidebar(show) {
            document.getElementById('sidebar').classList.toggle('open', show);
            document.getElementById('sidebarOverlay').classList.toggle('open', show);
            if (show) renderSidebarHistory();
        }

        function createNewChat() {
            currentSessionId = 'session_' + Date.now();
            chatSessions[currentSessionId] = { id: currentSessionId, title: 'New Conversation', messages: [] };
            saveSessions();
            renderWelcomeScreen();
            toggleSidebar(false);
        }

        function loadChatSession(id) {
            currentSessionId = id;
            const session = chatSessions[id];
            if (!session) return;

            if (session.messages.length === 0) {
                renderWelcomeScreen();
            } else {
                chatBox.innerHTML = '<button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>';
                session.messages.forEach(msg => {
                    if (msg.role === 'user') {
                        let attHTML = '';
                        if (msg.files && msg.files.length > 0) {
                            msg.files.forEach(file => {
                                if (file.mimeType.startsWith('image/')) {
                                    attHTML += `<div style="margin-top: 6px;"><img src="${file.fullData}" onclick="openLightbox('${file.fullData}')" style="max-width: 150px; max-height: 150px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); object-fit: cover; display: block; cursor: pointer;"></div>`;
                                } else {
                                    attHTML += `<div style="margin-top: 6px; font-size: 0.8rem; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px;">📄 ${escapeHTML(file.name)}</div>`;
                                }
                            });
                        }
                        const content = (msg.text ? `<div>${escapeHTML(msg.text)}</div>` : '') + attHTML;
                        chatBox.innerHTML += `<div class="msg user">${content}</div>`;
                    } else {
                        const botDiv = document.createElement('div');
                        botDiv.className = 'msg bot';
                        botDiv.innerHTML = `<div>${marked.parse(msg.text)}</div>
                            <div class="bot-actions">
                                <button class="bot-action-btn" onclick="speakText(this)">🔊 Listen</button>
                                <button class="bot-action-btn" onclick="copyText(this)">📋 Copy</button>
                            </div>`;
                        chatBox.appendChild(botDiv);
                    }
                });
                // Gawing clickable ang mga images na na-render mula sa past messages
                chatBox.querySelectorAll('.msg img').forEach(img => {
                    img.onclick = () => openLightbox(img.src);
                });
                document.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
            }
            scrollToBottom(true);
            toggleSidebar(false);
            renderSidebarHistory();
        }

        function deleteChatSession(id, e) {
            e.stopPropagation();
            delete chatSessions[id];
            saveSessions();
            if (currentSessionId === id) createNewChat();
        }

        function renderSidebarHistory(filter = '') {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = '';
            Object.values(chatSessions).reverse().forEach(session => {
                if (filter && !session.title.toLowerCase().includes(filter.toLowerCase())) return;
                const item = document.createElement('div');
                item.className = 'history-item' + (session.id === currentSessionId ? ' active' : '');
                item.onclick = () => loadChatSession(session.id);
                item.innerHTML = `
                    <span class="history-item-text">${escapeHTML(session.title)}</span>
                    <button class="delete-hist-btn" onclick="deleteChatSession('${session.id}', event)">🗑️</button>
                `;
                list.appendChild(item);
            });
        }

        function filterChatHistory() {
            renderSidebarHistory(document.getElementById('searchChatInput').value);
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const r = new FileReader();
                r.onload = (ex) => {
                    selectedFilesData.push({
                        name: file.name,
                        mimeType: file.type,
                        data: ex.target.result.split(',')[1],
                        fullData: ex.target.result
                    });
                    renderFilePreviews();
                };
                r.readAsDataURL(file);
            });
        }

        function renderFilePreviews() {
            const container = document.getElementById('filePreviewContainer');
            container.innerHTML = '';
            if (selectedFilesData.length === 0) { container.style.display = 'none'; return; }
            container.style.display = 'flex';
            selectedFilesData.forEach((file, index) => {
                const chip = document.createElement('div');
                chip.className = file.mimeType.startsWith('image/') ? 'gemini-chip img-chip' : 'gemini-chip';
                chip.innerHTML = file.mimeType.startsWith('image/') 
                    ? `<img src="${file.fullData}"><button class="chip-close-btn" onclick="removeFile(${index})">✕</button>`
                    : `<span>📄 ${escapeHTML(file.name)}</span><button class="chip-close-btn" onclick="removeFile(${index})">✕</button>`;
                container.appendChild(chip);
            });
        }

        function removeFile(index) {
            selectedFilesData.splice(index, 1);
            renderFilePreviews();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            const mode = currentSelectedMode;
            const model = currentSelectedModel;

            if (!message && selectedFilesData.length === 0) return;
            if (!currentSessionId || !chatSessions[currentSessionId]) createNewChat();

            const tempFiles = [...selectedFilesData];

            if (chatSessions[currentSessionId].messages.length === 0) {
                chatBox.innerHTML = '<button id="scrollBtn" onclick="scrollToBottom(true)">↓</button>';
                chatSessions[currentSessionId].title = message ? message.substring(0, 25) : (tempFiles.length > 0 ? tempFiles[0].name : 'Attachment');
            }

            userScrolledUp = false;

            let attachmentsHTML = '';
            tempFiles.forEach(file => {
                if (file.mimeType.startsWith('image/')) {
                    attachmentsHTML += `<div style="margin-top: 6px;"><img src="${file.fullData}" onclick="openLightbox('${file.fullData}')" style="max-width: 150px; max-height: 150px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); object-fit: cover; display: block; cursor: pointer;"></div>`;
                } else {
                    attachmentsHTML += `<div style="margin-top: 6px; font-size: 0.8rem; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px;">📄 ${escapeHTML(file.name)}</div>`;
                }
            });

            const userBubbleContent = (message ? `<div>${escapeHTML(message)}</div>` : '') + attachmentsHTML;
            chatBox.innerHTML += `<div class="msg user">${userBubbleContent}</div>`;
            
            chatSessions[currentSessionId].messages.push({ 
                role: 'user', 
                text: message, 
                files: tempFiles.map(f => ({ name: f.name, mimeType: f.mimeType, fullData: f.fullData })) 
            });
            saveSessions();

            input.value = '';
            selectedFilesData = [];
            renderFilePreviews();

            const botMsgElem = document.createElement('div');
            botMsgElem.className = 'msg bot';
            botMsgElem.innerText = 'Thinking...';
            chatBox.appendChild(botMsgElem);
            scrollToBottom(true);

            const customPrompt = document.getElementById('customPromptInput').value;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, files: tempFiles, model, mode, customPrompt })
                });

                if (!response.ok) {
                    throw new Error('Server returned status ' + response.status);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullResponse += decoder.decode(value, { stream: true });
                    botMsgElem.innerHTML = `<div>${marked.parse(fullResponse)}</div>
                        <div class="bot-actions">
                            <button class="bot-action-btn" onclick="speakText(this)">🔊 Listen</button>
                            <button class="bot-action-btn" onclick="copyText(this)">📋 Copy</button>
                        </div>`;
                    
                    // Gawing clickable ang anumang images na lumalabas sa stream/bot response
                    botMsgElem.querySelectorAll('img').forEach(img => {
                        img.onclick = () => openLightbox(img.src);
                    });

                    scrollToBottom(false);
                }

                chatSessions[currentSessionId].messages.push({ role: 'bot', text: fullResponse });
                saveSessions();
                document.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));

                if (document.getElementById('autoTTSToggle').checked) {
                    speakRawText(fullResponse);
                }

            } catch (err) {
                botMsgElem.innerHTML = `
                    <div style="color: #fca5a5; margin-bottom: 8px;">⚠️ Connection Error or Timeout.</div>
                    <button class="bot-action-btn" onclick="retryLastMessage()" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 4px 10px; border-radius: 6px;">
                        🔄 Try Again
                    </button>
                `;
                scrollToBottom(true);
            }
        }

        function retryLastMessage() {
            if (currentSessionId && chatSessions[currentSessionId]) {
                const messages = chatSessions[currentSessionId].messages;
                for (let i = messages.length - 1; i >= 0; i--) {
                    if (messages[i].role === 'user') {
                        const lastMsgText = messages[i].text;
                        chatSessions[currentSessionId].messages.pop();
                        const userInput = document.getElementById('userInput');
                        userInput.value = lastMsgText;
                        chatBox.removeChild(chatBox.lastChild);
                        sendMessage();
                        break;
                    }
                }
            }
        }

        function clearCurrentChat() {
            if (currentSessionId && chatSessions[currentSessionId]) {
                chatSessions[currentSessionId].messages = [];
                saveSessions();
                renderWelcomeScreen();
            }
        }

        function runCode(id) {
            const codeText = document.getElementById(id).innerText;
            const modal = document.getElementById('codePreviewModal');
            const iframe = document.getElementById('previewIframe');
            
            modal.classList.add('open');
            iframe.srcdoc = codeText;
        }

        function closeCodePreview() {
            const modal = document.getElementById('codePreviewModal');
            const iframe = document.getElementById('previewIframe');
            
            modal.classList.remove('open');
            iframe.srcdoc = '';
        }

        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('imageLightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = imgSrc;
            lightbox.classList.add('open');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('imageLightbox');
            lightbox.classList.remove('open');
        }

        function copyCode(id, btn) {
            navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => {
                btn.innerText = '✅ Copied!';
                setTimeout(() => btn.innerText = '📋 Copy', 2000);
            });
        }

        function copyText(btn) {
            const text = btn.closest('.msg').querySelector('div').innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = '✓ Copied!';
                setTimeout(() => btn.innerText = '📋 Copy', 2000);
            });
        }

        function speakText(btn) {
            speakRawText(btn.closest('.msg').querySelector('div').innerText);
        }

        function speakRawText(text) {
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();
            systemVoices = window.speechSynthesis.getVoices();
            
            if (systemVoices.length === 0) {
                setTimeout(() => speakRawText(text), 150);
                return;
            }

            const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[*_#`~]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);

            const tagalogWords = /\b(ang|mga|na|ay|at|sa|ko|mo|niya|kami|tayo|sila|ito|iyan|iyon|ba|ka|din|rin|nang|para|kay|kung|pero|syempre|gawin|ano|sino|saan|paano)\b/i;
            const isTagalog = tagalogWords.test(cleanText);

            let targetVoice = null;

            if (isTagalog) {
                targetVoice = systemVoices.find(v => {
                    const lang = (v.lang || '').toLowerCase();
                    const name = (v.name || '').toLowerCase();
                    return lang === 'fil-ph' || lang === 'tl-ph' || name.includes('filipino') || name.includes('tagalog');
                });
            }

            if (!targetVoice) {
                targetVoice = systemVoices.find(v => {
                    const lang = (v.lang || '').toLowerCase();
                    return lang === 'en-us' || lang === 'en-gb' || lang.startsWith('en');
                });
            }

            if (targetVoice) {
                utterance.voice = targetVoice;
                utterance.lang = targetVoice.lang;
            } else {
                utterance.lang = isTagalog ? 'fil-PH' : 'en-US';
            }

            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        function toggleSpeechRecognition() {
            const userInput = document.getElementById('userInput');
            const waveContainer = document.getElementById('waveContainer');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Speech recognition is not supported in this browser.');
                return;
            }

            if (isRecording) {
                if (recognition) recognition.stop();
                stopRecordingUI();
            } else {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'fil-PH';

                recognition.onstart = () => {
                    isRecording = true;
                    userInput.style.display = 'none';
                    waveContainer.classList.add('active');
                };

                recognition.onresult = (event) => {
                    userInput.value = event.results[0][0].transcript;
                    stopRecordingUI();
                };

                recognition.onerror = () => stopRecordingUI();
                recognition.onend = () => stopRecordingUI();

                recognition.start();
            }
        }

        function stopRecordingUI() {
            isRecording = false;
            document.getElementById('userInput').style.display = 'block';
            document.getElementById('waveContainer').classList.remove('active');
        }

        async function checkPing() {
            const pingText = document.getElementById('pingText');
            const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
            const start = performance.now();
            try {
                await fetch('/api/chat', { method: 'HEAD', cache: 'no-store' });
                pingText.innerText = Math.round(performance.now() - start) + ' ms';
                bars.forEach(bar => bar.style.backgroundColor = 'var(--sig-good)');
            } catch (e) {
                pingText.innerText = 'Offline';
                bars.forEach(bar => bar.style.backgroundColor = 'var(--sig-bad)');
            }
        }

        setInterval(checkPing, 5000);
        checkPing();

        function escapeHTML(s) { return s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t])); }

        if (Object.keys(chatSessions).length > 0) {
            loadChatSession(Object.keys(chatSessions)[Object.keys(chatSessions).length - 1]);
        } else {
            createNewChat();
        }
    </script>
</body>
