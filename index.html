<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JepongDevxyz AI</title>
  <meta name="description" content="JepongDevxyz AI — a fresh chat interface based on the measured Qwen Chat layout.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-frame">
    <aside id="sidebar" class="sidebar" aria-label="Chats">
      <div class="brand-row">
        <button class="brand" id="brandHome" type="button" aria-label="JepongDevxyz AI home">
          <span class="brand-mark" aria-hidden="true">J</span>
          <span class="brand-name">JepongDevxyz AI</span>
        </button>
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">☰</button>
      </div>

      <button class="nav-row new-chat" id="newChatBtn" type="button"><span class="nav-icon">＋</span><span class="nav-label">New Chat</span></button>

      <div class="search-wrap" id="searchWrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="chatSearch" type="search" placeholder="Search Chats" aria-label="Search chats" autocomplete="off">
        <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search" hidden>×</button>
      </div>
      <button class="nav-row rail-search" id="railSearchBtn" type="button" aria-label="Search chats"><span class="nav-icon">⌕</span></button>

      <div id="externalRows">
        <button class="nav-row" id="communityBtn" type="button"><span class="nav-icon">◎</span><span class="nav-label">Community</span></button>
        <button class="nav-row" id="coderBtn" type="button"><span class="nav-icon">⌘</span><span class="nav-label">Coder</span></button>
        <button class="nav-row" id="createBtn" type="button"><span class="nav-icon">✦</span><span class="nav-label">Create</span></button>
      </div>

      <div class="sidebar-scroll" id="sidebarScroll">
        <div id="manageBar" class="manage-bar" hidden>
          <label><input id="manageSelectAll" type="checkbox"> Select all</label>
          <span id="manageCount">Selected 0/0</span>
          <button id="manageCancel" class="white-pill" type="button">Cancel</button>
          <button id="manageDelete" class="danger-btn" type="button">Delete</button>
        </div>
        <div id="searchResults" class="history-list"></div>
        <div id="historySections">
          <button class="section-head" id="projectsToggle" type="button" aria-expanded="true"><span>Projects</span><span class="chev">⌄</span></button>
          <div id="projectsBody">
            <div id="projectList"></div>
            <button class="nav-row subtle" id="newProjectBtn" type="button"><span class="nav-icon">＋</span><span class="nav-label">New Project</span></button>
          </div>
          <button class="section-head" id="allChatsToggle" type="button" aria-expanded="true"><span>All chats</span><span class="chev">⌄</span></button>
          <div id="historyList" class="history-list"></div>
        </div>
        <div id="archivedSection">
          <button class="section-head" id="archivedToggle" type="button" aria-expanded="false"><span>Archived</span><span class="chev">›</span></button>
          <div id="archivedList" class="history-list" hidden></div>
        </div>
      </div>

      <div class="profile-block">
        <button id="profileBtn" class="profile-main" type="button" aria-haspopup="menu">
          <span class="avatar" id="profileAvatar">J</span>
          <span class="profile-copy"><strong id="profileName">Jepong</strong><small>Free</small></span>
        </button>
        <button id="upgradeBtn" class="upgrade-pill" type="button">Upgrade</button>
        <div id="profileMenu" class="profile-menu" role="menu" hidden>
          <div class="menu-header" id="profileMenuHeader">Local profile</div>
          <button type="button" data-profile-action="upgrade">Upgrade Plan</button>
          <button type="button" data-profile-action="usage">Usage</button>
          <button type="button" data-profile-action="settings">Settings</button>
          <button type="button" data-profile-action="archived">Archived Chats</button>
          <button type="button" data-profile-action="support">Customer Service Center</button>
          <div class="menu-sep"></div>
          <button type="button" class="danger-text" data-profile-action="logout">Log out</button>
        </div>
      </div>
    </aside>

    <main class="main-card" id="mainCard">
      <header class="topbar">
        <div class="model-wrap">
          <button id="modelBtn" class="model-btn" type="button" aria-haspopup="dialog" aria-expanded="false">
            <span id="selectedModelName">Gemini Flash Latest</span><span class="chev">⌄</span>
          </button>
          <div id="modelPanel" class="model-panel" hidden>
            <div class="model-panel-head"><strong>Current Model</strong><span id="modelCount"></span></div>
            <input id="modelSearch" type="search" placeholder="Search models" aria-label="Search models">
            <div id="modelList" class="model-list"></div>
            <button id="expandModelsBtn" class="expand-models" type="button">Expand more models ⌄</button>
            <div class="model-compare"><span>Model Comparison</span><button id="modelCompareToggle" class="switch" type="button" role="switch" aria-checked="false" aria-label="Model Comparison"></button></div>
          </div>
        </div>
        <div class="top-actions">
          <button id="topUpgradeBtn" class="black-pill" type="button">Upgrade</button>
          <button id="tempChatBtn" class="temp-btn" type="button" aria-pressed="false" title="Temporary Chat — This won't appear in your chat history.">▦</button>
          <button id="currentChatMenuBtn" class="icon-btn" type="button" aria-label="Current chat menu" hidden>•••</button>
        </div>
      </header>

      <section id="chatScroller" class="chat-scroller">
        <div id="temporaryBanner" class="temporary-banner" hidden>
          <h1>Temporary Chat</h1>
          <p>This chat won't appear in history and your messages will not be saved.</p>
        </div>
        <div id="homeView" class="home-view">
          <h1 id="homeGreeting">How can I help you?</h1>
          <div id="homeComposerSlot" class="home-composer-slot"></div>
        </div>
        <div id="messageColumn" class="message-column" hidden></div>
      </section>

      <div id="dock" class="dock">
        <div id="dockComposerSlot"></div>
        <p id="disclaimer" class="disclaimer" hidden>AI-generated content may not be accurate.</p>
      </div>

      <div id="shareBar" class="share-bar" hidden>
        <label><input id="shareSelectAll" type="checkbox"> Select all</label>
        <span id="shareCount"></span>
        <div><button id="shareCancel" class="white-pill" type="button">Cancel</button><button id="shareCopy" class="black-pill" type="button">Copy selection</button></div>
      </div>
    </main>

    <aside id="activityDrawer" class="activity-drawer" aria-label="Activity and search" hidden>
      <div class="drawer-head"><h2>Activity and Search</h2><button id="drawerClose" class="icon-btn" type="button" aria-label="Close activity">×</button></div>
      <div id="activityList" class="activity-list"></div>
    </aside>

    <section id="settingsPage" class="settings-page" hidden aria-label="Settings">
      <header class="settings-top"><button id="settingsBack" class="back-btn" type="button">← Settings</button></header>
      <div class="settings-layout">
        <nav id="settingsNav" class="settings-nav" aria-label="Settings sections"></nav>
        <div class="settings-content-wrap"><div id="settingsContent" class="settings-content"></div></div>
      </div>
    </section>
  </div>

  <div id="composerMount">
    <form id="composer" class="composer" autocomplete="off">
      <div id="attachmentChips" class="attachment-chips" hidden></div>
      <textarea id="composerInput" rows="1" placeholder="How can I help you?" aria-label="Message JepongDevxyz AI"></textarea>
      <div class="composer-row">
        <div class="composer-left">
          <button id="toolsBtn" class="round-btn plus" type="button" aria-label="Select mode and tools" aria-haspopup="menu" aria-expanded="false">＋</button>
        </div>
        <div class="composer-right">
          <button id="responseModeBtn" class="mode-btn" type="button" aria-haspopup="menu" aria-expanded="false"><span id="responseModeLabel">Auto</span><span class="chev">⌄</span></button>
          <button id="micBtn" class="round-btn mic" type="button" aria-label="Voice input" title="Voice input">🎙</button>
          <button id="voiceModeBtn" class="round-btn voice-mode" type="button" aria-label="Read replies aloud" aria-pressed="false" title="Read replies aloud">≋</button>
          <button id="sendBtn" class="send-btn" type="submit" aria-label="Send" disabled>↑</button>
          <button id="stopBtn" class="send-btn stop" type="button" aria-label="Stop generating" hidden>■</button>
        </div>
      </div>
      <div id="toolsMenu" class="tools-menu" role="menu" hidden>
        <button type="button" data-tool="upload">⇪ Upload</button>
        <button type="button" data-tool="research">⌕ Research</button>
        <button type="button" data-tool="image">▦ Create Image</button>
        <button type="button" data-tool="video">▶ Generative Video</button>
        <button type="button" data-tool="report">▤ Write Report</button>
        <button type="button" data-tool="deep-research">◎ Deep Research</button>
        <button type="button" data-tool="code">&lt;/&gt; Code</button>
        <button type="button" data-tool="ppt">▣ PPT</button>
        <div class="more-wrap">
          <button type="button" id="moreToolsBtn" aria-expanded="false">••• More <span>›</span></button>
          <div id="moreToolsMenu" class="more-menu" hidden>
            <button type="button" data-tool="slides">▣ Slides</button>
            <button type="button" data-tool="artifacts">▤ Artifacts</button>
            <button type="button" data-tool="learn">🎓 Learn</button>
            <button type="button" data-tool="travel">✈ Travel Planner</button>
          </div>
        </div>
        <div class="menu-sep"></div>
        <label class="tools-toggle"><span>Tools</span><button id="toolsEnabledToggle" class="switch" type="button" role="switch" aria-checked="true" aria-label="Tools"></button></label>
      </div>
      <div id="modeMenu" class="mode-menu" role="menu" hidden>
        <button type="button" data-response-mode="Auto">Auto <span class="check">✓</span></button>
        <button type="button" data-response-mode="Thinking">Thinking <span class="check">✓</span></button>
        <button type="button" data-response-mode="Fast">Fast <span class="check">✓</span></button>
      </div>
      <input id="fileInput" type="file" multiple hidden>
    </form>
  </div>

  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
