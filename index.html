<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JepongDevxyz AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(21, 29, 45, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --user-msg: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --bot-msg: rgba(30, 41, 59, 0.7);
            --sig-good: #10b981;
            --sig-bad: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); }

        .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card-bg); backdrop-filter: blur(20px); position: relative; }
        @media (min-width: 768px) {
            body { padding: 20px; display: flex; justify-content: center; align-items: center; }
            .app-container { max-width: 900px; height: 90vh; border: 1px solid var(--border-color); border-radius: 24px; }
        }

        .header { padding: 10px 14px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; background: rgba(11, 15, 25, 0.8); }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        
        .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex-shrink: 1; padding: 2px 0; }
        .brand-icon { width: 34px; height: 34px; background: var(--accent-gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; cursor: pointer; }
        .brand-title { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }

        .header-tools-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .network-status { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.7rem; color: var(--text-muted); }

        .signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
        .bar { width: 2.5px; background-color: var(--sig-good); border-radius: 1px; }
        .bar-1 { height: 25%; } .bar-2 { height: 50%; } .bar-3 { height: 75%; } .bar-4 { height: 100%; }

        .header-controls { display: flex; gap: 6px; width: 100%; flex-wrap: wrap; }
        select, .custom-prompt-input { flex: 1; background: rgba(30, 41, 59, 0.8); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; min-width: 140px; }
        .custom-prompt-input { display: none; width: 100%; margin-top: 4px; }
        .header-btn { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.72rem; flex-shrink: 0; }
        .clear-btn { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

        .sidebar-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 900; }
        .sidebar { position: absolute; top: 0; left: -280px; width: 280px; height: 100%; background: #0f172a; border-right: 1px solid var(--border-color); z-index: 901; transition: left 0.3s ease; display: flex; flex-direction: column; padding: 16px; gap: 14px; }
        .sidebar.open { left: 0; }
        .sidebar-overlay.open { display: block; }
        
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .sidebar-header h3 { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
        .close-sidebar-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }
        .new-chat-btn { background: var(--accent-gradient); color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .search-chat-input { background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; width: 100%; }
        .chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .history-item { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .history-item.active { border-color: #6366f1; background: rgba(99, 102, 241, 0.15); }
        .history-item-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; position: relative; }
        
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; margin: auto; width: 100%; }
        .welcome-lottie-top { width: 220px; height: 60px; margin-bottom: -10px; }
        .welcome-title { font-size: 1.85rem; font-weight: 700; background: linear-gradient(90deg, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; margin: 0; line-height: 1; }
        .welcome-lottie-bottom { width: 100%; max-width: 260px; height: auto; aspect-ratio: 16 / 9; margin-top: -55px; }

        .msg { max-width: 88%; padding: 12px 16px; border-radius: 16px; font-size: 0.92rem; line-height: 1.5; word-break: break-word; position: relative; }
        .user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: var(--bot-msg); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; display: flex; flex-direction: column; gap: 8px; }
        .bot img { max-width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid var(--border-color); }

        .bot-actions { display: flex; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .bot-action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; text-decoration: none; }

        .code-block-wrapper { background: #131722; border: 1px solid var(--border-color); border-radius: 10px; margin: 8px 0; overflow: hidden; }
        .code-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 6px 12px; font-size: 0.75rem; color: var(--text-muted); }
        .code-actions button { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
        pre { padding: 12px; overflow-x: auto; font-size: 0.85rem; }

        .input-container { padding: 10px 14px 14px 14px; background: transparent; }
        .chat-input-card { background: #1e293b; border: 1px solid var(--border-color); border-radius: 24px; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }

        .file-preview-row { display: none; gap: 8px; overflow-x: auto; padding: 4px 2px 6px 2px; }
        .gemini-chip { position: relative; display: inline-flex; align-items: center; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 4px 8px; height: 48px; }
        .gemini-chip.img-chip { padding: 0; width: 52px; height: 52px; border-radius: 12px; overflow: hidden; }
        .gemini-chip img { width: 100%; height: 100%; object-fit: cover; }
        .chip-close-btn { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; background: rgba(0, 0, 0, 0.75); border: none; color: #ffffff; border-radius: 50%; font-size: 0.65rem; cursor: pointer; }

        .input-text-row { display: flex; align-items: center; width: 100%; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #ffffff !important; font-size: 0.92rem; padding: 6px 8px; caret-color: #38bdf8; }

        .input-actions-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .input-actions-left, .input-actions-right { display: flex; align-items: center; gap: 6px; }

        .action-icon-btn, .mic-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; }
        .send-btn { background: #2563eb; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }

        #scrollBtn { display: none; position: absolute; bottom: 85px; right: 20px; background: var(--accent-gradient); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>💬 Chat History</h3>
                <button class="close-sidebar-btn" onclick="toggleSidebar(false)">✕</button>
            </div>
            <button class="new-chat-btn" onclick="createNewChat()"><span>➕</span> New Chat</button>
            <input type="text" class="search-chat-input" id="searchChatInput" placeholder="🔍 Search chat..." oninput="filterChatHistory()">
            <div class="chat-history-list" id="chatHistoryList"></div>
        </div>

        <div class="header">
            <div class="header-top">
                <div class="brand">
                    <div class="brand-icon" onclick="toggleSidebar(true)">✦</div>
                    <div class="brand-title">JepongDevxyz AI</div>
                </div>
                <div class="header-tools-group">
                    <div class="network-status" id="networkStatus">
                        <div class="signal-bars">
                            <div class="bar bar-1" id="bar1"></div>
                            <div class="bar bar-2" id="bar2"></div>
                            <div class="bar bar-3" id="bar3"></div>
                            <div class="bar bar-4" id="bar4"></div>
                        </div>
                        <span id="pingText">Checking...</span>
                    </div>
                    <button class="header-btn clear-btn" onclick="clearCurrentChat()">Clear</button>
                </div>
            </div>

            <div class="header-controls">
                <select id="modeSelect" onchange="checkCustomMode()">
                    <option value="general">🤖 Mode: General AI</option>
                    <option value="coder">💻 Mode: Expert Coder</option>
                    <option value="image_gen">🎨 Mode: Image Generator</option>
                    <option value="custom">✏️ Mode: Custom Persona</option>
                </select>
                <select id="modelSelect">
                    <option value="gemini-3.6-flash" selected>Gemini 3.6 Flash</option>
                    <option value="gemini-3.7-extended-thinking">Gemini 3.7 Thinking</option>
                </select>
                <input type="text" id="customPromptInput" class="custom-prompt-input" placeholder="Type custom persona instructions here...">
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <button id="scrollBtn" onclick="scrollToBottom()">↓</button>
        </div>

        <div class="input-container">
            <div class="chat-input-card">
                <div class="file-preview-row" id="filePreviewContainer"></div>

                <div class="input-text-row">
                    <input type="text" id="userInput" placeholder="Ask JepongDevxyz AI..." onkeydown="if(event.key==='Enter') sendMessage()">
                </div>

                <div class="input-actions-row">
                    <div class="input-actions-left">
                        <input type="file" id="fileInput" hidden multiple onchange="handleFileSelect(event)">
                        <button class="action-icon-btn" onclick="document.getElementById('fileInput').click()">➕</button>
                    </div>
                    <div class="input-actions-right">
                        <button class="send-btn" onclick="sendMessage()">➔</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFilesData = [];
        let chatSessions = {};
        let currentSessionId = null;

        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            const codeContent = typeof code === 'object' ? code.text : code;
            const lang = language || 'code';
            const blockId = 'code-' + Math.random().toString(36).substring(2, 9);
            return `
                <div class="code-block-wrapper">
                    <div class="code-header">
                        <span>${lang}</span>
                        <button onclick="copyCode('${blockId}', this)">📋 Copy</button>
                    </div>
                    <pre><code id="${blockId}" class="language-${lang}">${escapeHTML(codeContent)}</code></pre>
                </div>
            `;
        };
        marked.use({ renderer });

        const chatBox = document.getElementById('chatBox');
        function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }

        function checkCustomMode() {
            const mode = document.getElementById('modeSelect').value;
            document.getElementById('customPromptInput').style.display = mode === 'custom' ? 'block' : 'none';
        }

        function renderWelcomeScreen() {
            chatBox.innerHTML = `
                <div class="welcome-screen">
                    <lottie-player class="welcome-lottie-top" src="https://lottie.host/035962ae-ec85-4735-ac5b-3a3764108916/y2Kb1ZKXAi.json" background="transparent" speed="1" loop autoplay></lottie-player>
                    <div class="welcome-title">JepongDevxyz AI</div>
                    <lottie-player class="welcome-lottie-bottom" src="https://lottie.host/2477a7dc-71fb-4c1b-ab00-e006ead8ebe6/Ydd9GqGGLm.json" background="transparent" speed="1" loop autoplay></lottie-player>
                </div>
                <button id="scrollBtn" onclick="scrollToBottom()">↓</button>
            `;
        }

        function toggleSidebar(show) {
            document.getElementById('sidebar').classList.toggle('open', show);
            document.getElementById('sidebarOverlay').classList.toggle('open', show);
        }

        function createNewChat() {
            currentSessionId = 'session_' + Date.now();
            chatSessions[currentSessionId] = { id: currentSessionId, title: 'New Conversation', messages: [] };
            renderWelcomeScreen();
            toggleSidebar(false);
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const r = new FileReader();
                r.onload = (ex) => {
                    selectedFilesData.push({
                        name: file.name,
                        mimeType: file.type,
                        data: ex.target.result.split(',')[1],
                        fullData: ex.target.result
                    });
                    renderFilePreviews();
                };
                r.readAsDataURL(file);
            });
        }

        function renderFilePreviews() {
            const container = document.getElementById('filePreviewContainer');
            container.innerHTML = '';
            if (selectedFilesData.length === 0) { container.style.display = 'none'; return; }
            container.style.display = 'flex';
            selectedFilesData.forEach((file, index) => {
                const chip = document.createElement('div');
                chip.className = file.mimeType.startsWith('image/') ? 'gemini-chip img-chip' : 'gemini-chip';
                chip.innerHTML = file.mimeType.startsWith('image/') 
                    ? `<img src="${file.fullData}"><button class="chip-close-btn" onclick="removeFile(${index})">✕</button>`
                    : `<span>📄 ${escapeHTML(file.name)}</span><button class="chip-close-btn" onclick="removeFile(${index})">✕</button>`;
                container.appendChild(chip);
            });
        }

        function removeFile(index) {
            selectedFilesData.splice(index, 1);
            renderFilePreviews();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            const mode = document.getElementById('modeSelect').value;
            const model = document.getElementById('modelSelect').value;

            if (!message && selectedFilesData.length === 0) return;
            if (!currentSessionId || !chatSessions[currentSessionId]) createNewChat();

            if (chatSessions[currentSessionId].messages.length === 0) {
                chatBox.innerHTML = '<button id="scrollBtn" onclick="scrollToBottom()">↓</button>';
                chatSessions[currentSessionId].title = message.substring(0, 25);
            }

            chatBox.innerHTML += `<div class="msg user">${escapeHTML(message)}</div>`;
            chatSessions[currentSessionId].messages.push({ role: 'user', text: message });
            input.value = '';

            const botMsgElem = document.createElement('div');
            botMsgElem.className = 'msg bot';
            botMsgElem.innerText = 'Thinking...';
            chatBox.appendChild(botMsgElem);
            scrollToBottom();

            // 🎨 IMAGEN 3 GENERATOR
            if (mode === 'image_gen') {
                botMsgElem.innerText = '🎨 Generating image via Imagen 3...';
                try {
                    const res = await fetch('/api/generate-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: message })
                    });
                    const data = await res.json();
                    if (data.success) {
                        const imageMarkdown = `Here is your generated image:\n\n![Generated Image](${data.imageUrl})`;
                        botMsgElem.innerHTML = `<div>${marked.parse(imageMarkdown)}</div>
                            <div class="bot-actions"><a href="${data.imageUrl}" download="imagen.jpg" class="bot-action-btn">📥 Download</a></div>`;
                    } else {
                        botMsgElem.innerText = '⚠️ Error generating image.';
                    }
                } catch (err) {
                    botMsgElem.innerText = '⚠️ Connection Error.';
                }
                selectedFilesData = [];
                renderFilePreviews();
                return;
            }

            // 🤖 TEXT CHAT STREAMING
            const tempFiles = [...selectedFilesData];
            selectedFilesData = [];
            renderFilePreviews();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, files: tempFiles, model })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullResponse += decoder.decode(value, { stream: true });
                    botMsgElem.innerHTML = `<div>${marked.parse(fullResponse)}</div>`;
                    scrollToBottom();
                }

                chatSessions[currentSessionId].messages.push({ role: 'bot', text: fullResponse });
                document.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));

            } catch (err) {
                botMsgElem.innerText = 'Connection Error.';
            }
        }

        function clearCurrentChat() {
            if (currentSessionId && chatSessions[currentSessionId]) {
                chatSessions[currentSessionId].messages = [];
                renderWelcomeScreen();
            }
        }

        function copyCode(id, btn) {
            navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => {
                btn.innerText = '✓ Copied!';
                setTimeout(() => btn.innerText = '📋 Copy', 2000);
            });
        }

        function escapeHTML(s) { return s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t])); }

        createNewChat();
    </script>
</body>
</html>
